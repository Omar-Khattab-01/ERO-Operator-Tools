    function refreshCountdowns() {
      const nowSeconds = getOttawaNowSeconds();
      document.querySelectorAll('[data-countdown][data-target-time]').forEach((node) => {
        const targetSeconds = timeToSecondsClock(node.getAttribute('data-target-time'));
        if (targetSeconds === null) return;
        let diff = targetSeconds - nowSeconds;
        if (diff < 0) {
          node.textContent = `${node.getAttribute('data-countdown')} updating...`;
          const card = node.closest('[data-paddle-card]');
          if (card) {
            refreshPaddleCard(card);
          } else if (!paddleOverlay.hidden) {
            refreshOpenPaddleModal();
          }
          return;
        }
        node.textContent = `${node.getAttribute('data-countdown')} ${formatCountdown(diff)}`;
      });
      document.querySelectorAll('[data-trip-start][data-trip-end] .trip-train').forEach((node) => {
        const row = node.closest('[data-trip-start][data-trip-end]');
        const startSeconds = timeToSecondsClock(row?.getAttribute('data-trip-start'));
        const endSeconds = timeToSecondsClock(row?.getAttribute('data-trip-end'));
        if (startSeconds === null || endSeconds === null) return;
        let now = nowSeconds;
        const start = startSeconds;
        let end = endSeconds;
        if (end < start) end += 24 * 3600;
        if (now < start && (start - now) > 12 * 3600) now += 24 * 3600;

        let progress = 90;
        if (now < start) {
          progress = 10;
        } else if (now > end) {
          progress = 90;
        } else {
          const total = Math.max(1, end - start);
          const elapsed = Math.min(Math.max(0, now - start), total);
          progress = 10 + ((elapsed / total) * 80);
        }
        node.style.setProperty('--train-progress', `${progress}%`);
      });
      checkTripStartNotifications(nowSeconds);
    }

    function checkTripStartNotifications(nowSeconds = getOttawaNowSeconds()) {
      if (!tripNotificationSettings.enabled || !('Notification' in window) || Notification.permission !== 'granted') return;
      const leadSeconds = (Number(tripNotificationSettings.leadMinutes) || 5) * 60;
      document.querySelectorAll('[data-trip-notify-target]').forEach((node) => {
        const targetTime = node.getAttribute('data-trip-notify-target') || '';
        const targetSeconds = timeToSecondsClock(targetTime);
        if (targetSeconds === null) return;
        let diff = targetSeconds - nowSeconds;
        if (diff < -60) diff += 24 * 3600;
        if (diff < 0 || diff > leadSeconds) return;
        const card = node.closest('[data-paddle-card]');
        const paddleId = card?.dataset?.paddleCard || 'paddle';
        const serviceDay = card?.dataset?.serviceDay || '';
        const trip = node.getAttribute('data-trip-notify-trip') || '';
        const block = node.getAttribute('data-trip-notify-block') || '';
        const station = node.getAttribute('data-trip-notify-station') || '';
        const notificationKey = [getTodayDateValue(), paddleId, serviceDay, trip, block, targetTime].join('|');
        if (tripNotificationFired.has(notificationKey)) return;
        tripNotificationFired.add(notificationKey);
        saveTripNotificationFired();
        const title = `Trip${trip ? ` ${trip}` : ''} starts in ${Math.max(1, Math.ceil(diff / 60))} min`;
        const detail = [
          `Paddle ${paddleId}`,
          block ? `Block ${block}` : '',
          station ? `Start: ${station}` : '',
          targetTime ? `At ${targetTime}` : '',
        ].filter(Boolean).join(' | ');
        showTripStartNotification(title, {
          body: detail,
          tag: `ero-trip-${notificationKey}`,
        });
      });
    }

            <div class="trip-duration">${typeof trip.durationMinutes === 'number' ? `${escapeHtml(trip.durationMinutes)} min` : 'In service'}</div>
            <div class="trip-rail"><span class="trip-train"><svg class="otrain-icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="6" width="14" height="9" rx="2" fill="#ffb068"/><rect x="7" y="8" width="4" height="3" rx="0.8" fill="#1c2128"/><rect x="13" y="8" width="4" height="3" rx="0.8" fill="#1c2128"/><path d="M8 18h8" stroke="#ffb068" stroke-width="1.8" stroke-linecap="round"/><circle cx="9" cy="17" r="1.3" fill="#f2f4f8"/><circle cx="15" cy="17" r="1.3" fill="#f2f4f8"/></svg></span></div>
          </div>
            <div class="trip-side end">
              <div class="trip-stop">${escapeHtml(trip.endStop || '')}</div>
              <div class="trip-time">${escapeHtml(trip.endTime || '')}</div>
              <div class="trip-subtext">${isActiveTrip ? 'Live now' : '&nbsp;'}</div>
              ${isActiveTrip && showReturnJump ? '<div class="trip-live-actions"><button class="trip-jump-btn" type="button" data-inline-paddle-jump data-jump-state="top" title="Back to top of paddle">&#8593;</button></div>' : ''}
            </div>
          </div>
        `;
      }

    function deriveEntryDirection(entry) {
      const firstTrip = (entry.trips || [])[0] || null;
      const startStop = String(firstTrip?.startStop || '').toLowerCase();
      const endStop = String(firstTrip?.endStop || '').toLowerCase();
      const startsFromPhnd = startStop.includes('phnd');
      const startsFromTerminus = startStop.includes('blair') || startStop.includes("tunney");
      const endsAtExit = endStop.includes('pexite') || endStop.includes('pexitw');
      if (startsFromTerminus && endsAtExit) return 'Reduction';
      if (startsFromPhnd && endStop.includes('tremblay')) return 'Launching West';
      if (startsFromPhnd && (endStop.includes('st laurent') || endStop.includes('st-laurent'))) return 'Launching East';
      if (endStop.includes('blair')) return 'East to Blair';
      if (endStop.includes("tunney")) return "West to Tunney's";
      return '';
    }

    function renderEntryCard(entry, live, showReturnJump = false) {
      const tripRows = (entry.trips || []).map((trip, index) => renderTripRow(entry, trip, live, index, showReturnJump)).join('');
      const directionLabel = deriveEntryDirection(entry);
      const isLiveBreak = Boolean(
        live
        && live.kind === 'break'
        && String(live.block || '') === String(entry.block || '')
        && String(live.sequence || '') === String(entry.sequence || '')
      );
      const isSplitBreak = typeof entry.breakAfterMinutes === 'number' && entry.breakAfterMinutes >= 90;
      const breakStrip = typeof entry.breakAfterMinutes === 'number' && entry.breakAfterMinutes > 0
        ? isSplitBreak
            ? `
            <div class="break-strip split-break${isLiveBreak ? ' active-break' : ''}" data-break-block="${escapeHtml(entry.block)}" data-break-sequence="${escapeHtml(entry.sequence)}">
              ${isLiveBreak && showReturnJump ? '<div class="break-strip-head"><span></span><button class="trip-jump-btn" type="button" data-inline-paddle-jump data-jump-state="top" title="Back to top of paddle">&#8593;</button></div>' : ''}
              <div class="split-side left">
                <div class="split-label">Clear</div>
                <div class="split-time">${escapeHtml(entry.clearTime || entry.endTime || '')}</div>
            </div>
            <div class="split-center">
              <div class="break-title">Split break</div>
              <div class="break-detail">${escapeHtml(formatDurationMinutes(entry.breakAfterMinutes))}</div>
            </div>
            <div class="split-side right">
              <div class="split-label">Back</div>
              <div class="split-time">${escapeHtml(entry.nextBlockReportTime || entry.nextBlockStartTime || '')}</div>
            </div>
            ${isLiveBreak ? `<div class="break-countdown">${renderCountdown(live, 'Remaining')}</div>` : ''}
          </div>
        `
          : `
            <div class="break-strip${isLiveBreak ? ' active-break' : ''}" data-break-block="${escapeHtml(entry.block)}" data-break-sequence="${escapeHtml(entry.sequence)}">
              ${isLiveBreak
                ? `<div class="break-strip-head"><span class="break-pill">Break ${escapeHtml(entry.breakAfterMinutes)} min</span>${showReturnJump ? '<button class="trip-jump-btn" type="button" data-inline-paddle-jump data-jump-state="top" title="Back to top of paddle">&#8593;</button>' : ''}</div><span>${renderCountdown(live, 'Remaining')}</span>`
                : `<span class="break-pill">Break ${escapeHtml(entry.breakAfterMinutes)} min</span>`}
            </div>
          `
        : '';
      return `
        <div class="block-stack">
          <article class="entry-card${live && live.kind === 'trip' && String(live.block || '') === String(entry.block || '') && String(live.sequence || '') === String(entry.sequence || '') ? ' active' : ''}" data-entry-block="${escapeHtml(entry.block)}" data-entry-sequence="${escapeHtml(entry.sequence)}">
            <div class="entry-head">
              <h4>
                <span>Trip ${escapeHtml(entry.sequence)}</span>
                ${entry.radioCheckNeeded ? '<span class="radio-check">Radio check required</span>' : ''}
              </h4>
              <div class="entry-direction">${escapeHtml(directionLabel)}</div>
              <div class="entry-block">Block ${escapeHtml(entry.block)}</div>
            </div>
            <div class="entry-lines">${tripRows}</div>
          </article>
          ${breakStrip}
        </div>
      `;
    }

    function findCurrentPaddleTargetInRoot(root, live) {
      if (!root || !live) return null;
      if (live.kind === 'break') {
        const breakNode = root.querySelector(`.break-strip.active-break[data-break-block="${CSS.escape(String(live.block || ''))}"][data-break-sequence="${CSS.escape(String(live.sequence || ''))}"]`);
        if (breakNode) return breakNode;
      }
      if (live.kind === 'trip') {
        const liveEntry = root.querySelector(`.entry-card.active[data-entry-block="${CSS.escape(String(live.block || ''))}"][data-entry-sequence="${CSS.escape(String(live.sequence || ''))}"]`);
        if (liveEntry) return liveEntry;
      }
      if (live.kind === 'prestart' || live.kind === 'clearing') {
        const entryNode = root.querySelector(`.entry-card[data-entry-block="${CSS.escape(String(live.block || ''))}"][data-entry-sequence="${CSS.escape(String(live.sequence || ''))}"]`);
        if (entryNode) return entryNode;
      }
      return root.querySelector('.entry-card.active')
        || root.querySelector('.break-strip.active-break')
        || null;
    }

    function findCurrentPaddleTarget(live) {
      return findCurrentPaddleTargetInRoot(paddleBody, live);
    }

    function readLiveStatusFromCard(card) {
      if (!card) return null;
      return {
        kind: card.dataset.liveKind || '',
        block: card.dataset.liveBlock || '',
        sequence: card.dataset.liveSequence || '',
      };
    }

    function updateCardJumpButtonState(button, state) {
      if (!button) return;
      button.dataset.jumpState = state;
      button.textContent = state === 'top' ? '↑' : '↓';
      button.title = state === 'top' ? 'Back to top of paddle' : 'Jump to current trip';
    }

    function handleInlinePaddleJump(button) {
      const card = button.closest('[data-paddle-card]');
      if (!card) return;
      const modalBodyRoot = button.closest('#paddleOverlay')?.querySelector('.modal-body') || null;
      const state = button.dataset.jumpState || 'current';
      if (state === 'top') {
        if (modalBodyRoot) {
          modalBodyRoot.scrollTo({ top: 0, behavior: 'smooth' });
        } else {
          card.scrollIntoView({ behavior: 'smooth', block: 'start' });
        }
        return;
      }
      const live = readLiveStatusFromCard(card);
      const target = findCurrentPaddleTargetInRoot(card, live);
      if (!target) return;
      if (modalBodyRoot) {
        const modalRect = modalBodyRoot.getBoundingClientRect();
        const targetRect = target.getBoundingClientRect();
        const offset = Math.max(24, modalBodyRoot.clientHeight * 0.18);
        const nextTop = modalBodyRoot.scrollTop + (targetRect.top - modalRect.top) - offset;
        modalBodyRoot.scrollTo({ top: Math.max(0, nextTop), behavior: 'smooth' });
      } else {
        target.scrollIntoView({ behavior: 'smooth', block: 'center' });
      }
    }

    function jumpToCurrentPaddlePosition() {
      const target = findCurrentPaddleTarget(currentLookup?.liveStatus || null);
      if (!target) return;
      target.scrollIntoView({ behavior: 'smooth', block: 'center' });
    }

          const response = await fetch(`/api/paddle?${params.toString()}`);

          if (!response.ok || !data.ok) return null;

      todaysPaddleView.innerHTML = `

    async function submitLrvDefectReport() {
      if (!supabaseClient || !currentUser || !canReportLrvDefects()) return;
      const lrvNumber = Number(document.getElementById('lrvReportNumber')?.value || selectedLrvNumber);
      const cab = document.getElementById('lrvReportCab')?.value || selectedLrvCab;
      const defectCategory = document.getElementById('lrvDefectCategory')?.value || selectedLrvDefectCategory;
      const seatIssueDetail = defectCategory === 'seat_issue'
        ? document.getElementById('lrvSeatIssueDetail')?.value || selectedLrvSeatIssueDetail
        : null;
      const thermoKingMode = defectCategory === 'thermo_king'
        ? document.getElementById('lrvThermoKingMode')?.value || selectedLrvThermoKingMode
        : null;
      const mlcReportedAt = dateTimeLocalToIso(document.getElementById('lrvMlcReportedAt')?.value || '');
      const typedDefectText = document.getElementById('lrvDefectText')?.value?.trim() || '';
      const generatedSummary = [
        formatLrvDefectCategory(defectCategory),
        seatIssueDetail ? formatLrvSeatIssueDetail(seatIssueDetail) : '',
        thermoKingMode ? formatLrvThermoKingMode(thermoKingMode) : '',
      ].filter(Boolean).join(' - ');
      const defectText = typedDefectText || generatedSummary;
      if (!lrvNumbers.includes(lrvNumber) || !['MC1', 'MC2'].includes(cab) || !defectCategory || !defectText) {
        setStatus('Complete the defect report first', false);
        showToast('Report not saved', 'Choose an LRV, cab, and defect type.');
        return;
      }
      let error = null;
      try {
        ({ error } = await withLrvRequestTimeout(supabaseClient
          .from('ero_lrv_defect_reports')
          .insert({
            lrv_number: lrvNumber,
            cab,
            defect_category: defectCategory,
            seat_issue_detail: seatIssueDetail,
            thermo_king_mode: thermoKingMode,
            mlc_reported_at: mlcReportedAt,
            report_status: 'open',
            defect_text: defectText,
            reported_by: currentUser.id,
            reported_by_email: currentUser.email || '',
          }), 'LRV defect submit'));
      } catch (requestError) {
        error = requestError;
      }
      if (error) {
        setStatus('Report failed', false);
        showToast('Report failed', error.message || 'Could not save the defect.');
        return;
      }
      selectedLrvNumber = lrvNumber;
      selectedLrvCab = cab;
      selectedLrvDefectCategory = defectCategory;
      selectedLrvSeatIssueDetail = seatIssueDetail || selectedLrvSeatIssueDetail;
      selectedLrvThermoKingMode = thermoKingMode || selectedLrvThermoKingMode;
      await renderLrvDefectsPage();
      setStatus('Defect reported', true);
      showToast('Defect reported', `LRV ${formatLrvNumber(lrvNumber)} ${cab}`);
    }

    async function grantLrvDefectAccess() {
      if (!supabaseClient || !isLrvDefectAdmin()) return;
      const email = normalizeEmail(document.getElementById('lrvAccessEmail')?.value || '');
      const role = normalizeLrvAccessRole(document.getElementById('lrvAccessRole')?.value || 'reporter');
      if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
        setStatus('Enter a valid email', false);
        return;
      }
      let error = null;
      try {
        ({ error } = await withLrvRequestTimeout(supabaseClient
          .from('ero_lrv_defect_access')
          .upsert({ email, role, granted_by: currentUser.id }, { onConflict: 'email' }), 'LRV access save'));
      } catch (requestError) {
        error = requestError;
      }
      if (error) {
        setLrvSchemaWarning(error);
        setStatus('Grant failed', false);
        showToast('Grant failed', lrvDefectSchemaWarning || error.message || 'Could not grant access.');
        return;
      }
      lrvDefectSchemaWarning = '';
      lrvDefectAccessPendingRoles.set(email, role);
      upsertLocalLrvDefectAccess(email, role);
      syncCurrentLrvDefectAccess(email, role);
      refreshLrvDefectAdminPanel();
      setStatus('Access saved', true);
      showToast('Access saved', `${email} is ${formatLrvAccessRole(role).toLowerCase()}.`);
      window.alert(`${email} has been assigned ${formatLrvAccessRole(role)} access.`);
      await refreshLrvDefectAccessAfterMutation(email, role);
    }

    async function updateLrvDefectAccessRole(email, role) {
      if (!supabaseClient || !isLrvDefectAdmin()) return;
      const normalizedEmail = normalizeEmail(email);
      const normalizedRole = normalizeLrvAccessRole(role);
      if (!normalizedEmail) return;
      let error = null;
      try {
        ({ error } = await withLrvRequestTimeout(supabaseClient
          .from('ero_lrv_defect_access')
          .update({ role: normalizedRole, granted_by: currentUser.id })
          .eq('email', normalizedEmail), 'LRV role update'));

    const ATS_LEFT = 95;
    const ATS_GAP = 138;
    const ATS_TRACK_1_Y = 150;
    const ATS_TRACK_2_Y = 245;
    const ATS_STATION_Y = 318;
    const ATS_RENDER_STATIONS = [
      { id: 'st01', code: 'ST01', label: ["Tunney's", 'Pasture'] },
      { id: 'st02', code: 'ST02', label: ['Bayview'] },
      { id: 'st03', code: 'ST03', label: ['Pimisi'] },
      { id: 'st04', code: 'ST04', label: ['Lyon'] },
      { id: 'st05', code: 'ST05', label: ['Parliament'] },
      { id: 'st06', code: 'ST06', label: ['Rideau'] },
      { id: 'st07', code: 'ST07', label: ['uOttawa'] },
      { id: 'st08', code: 'ST08', label: ['Lees'] },
      { id: 'st09', code: 'ST09', label: ['Hurdman'] },
      { id: 'st10', code: 'ST10', label: ['Tremblay'] },
      { id: 'st11', code: 'ST11', label: ['St-Laurent'] },
      { id: 'st12', code: 'ST12', label: ['Cyrville'] },
      { id: 'st13', code: 'ST13', label: ['Blair'] },
      { id: 'st14', code: 'ST14', label: ['Montreal'] },
      { id: 'st15', code: 'ST15', label: ['Jeanne', "d'Arc"] },
      { id: 'st16', code: 'ST16', label: ['Convent', 'Glen'] },
      { id: 'st17', code: 'ST17', label: ['Place', "d'Orleans"] },
      { id: 'st18', code: 'ST18', label: ['Trim'] },
    ];
    const ATS_RENDER_LEFT = 132;
    const ATS_RENDER_GAP = 146;
    const ATS_RENDER_TRACK_1_Y = 140;
    const ATS_RENDER_TRACK_2_Y = 245;
    const ATS_RENDER_LABEL_Y = 78;
    const ATS_MIMIC_WIDTH = 2720;
    const ATS_MIMIC_HEIGHT = 430;

    function stationX(index) {
      return ATS_RENDER_LEFT + (index * ATS_RENDER_GAP);
    }

    function projectTrainX(train, sourceStations) {
      const fallbackStations = Array.isArray(sourceStations) && sourceStations.length ? sourceStations : [];
      const minLon = Math.min(...fallbackStations.slice(0, 13).map((station) => station.lon));
      const maxLon = Math.max(...fallbackStations.slice(0, 13).map((station) => station.lon));
      if (!Number.isFinite(minLon) || !Number.isFinite(maxLon)) return stationX(0);
      const raw = ((Number(train.longitude) - minLon) / Math.max(0.0001, maxLon - minLon));
      return Math.min(stationX(12), Math.max(stationX(0), stationX(0) + (raw * (stationX(12) - stationX(0)))));
    }

    function blockIndexForX(x) {
      return Math.max(0, Math.min(ATS_RENDER_STATIONS.length - 2, Math.floor((x - ATS_RENDER_LEFT) / ATS_RENDER_GAP)));
    }

    function trainStatusFor(train, index) {
      const atPlatform = ATS_RENDER_STATIONS.some((_, stationIndex) => Math.abs(train.x - stationX(stationIndex)) < 12);
      if (atPlatform) return 'At platform';
      if (index % 7 === 0) return '+2';
      return 'On time';
    }

    function stationDisplayName(index) {
      const station = ATS_RENDER_STATIONS[Math.max(0, Math.min(ATS_RENDER_STATIONS.length - 1, index))];
      return station ? station.label.join(' ') : '';
    }

    function nearestStationIndex(x) {
      let bestIndex = 0;
      let bestDistance = Number.MAX_SAFE_INTEGER;
      ATS_RENDER_STATIONS.forEach((_, index) => {
        const distance = Math.abs(x - stationX(index));
        if (distance < bestDistance) {
          bestDistance = distance;
          bestIndex = index;
        }
      });
      return { index: bestIndex, distance: bestDistance };
    }

    function nextStationForTrain(train) {
      const nearest = nearestStationIndex(train.x);
      if (nearest.distance < 12) {
        const targetIndex = train.direction === 'west' ? nearest.index - 1 : nearest.index + 1;
        return stationDisplayName(targetIndex);
      }
      const blockIndex = blockIndexForX(train.x);
      return train.direction === 'west'
        ? stationDisplayName(blockIndex)
        : stationDisplayName(blockIndex + 1);
    }

    function currentSectionForTrain(train) {
      const nearest = nearestStationIndex(train.x);
      if (nearest.distance < 12) return `At ${stationDisplayName(nearest.index)}`;
      const blockIndex = blockIndexForX(train.x);
      const westStation = stationDisplayName(blockIndex);
      const eastStation = stationDisplayName(blockIndex + 1);
      return `Between ${westStation} and ${eastStation}`;
    }

    function setLiveMapZoom(nextZoom) {
      liveMapZoomTouched = true;
      const scroll = liveMapView.querySelector('.mimic-scroll');
      if (scroll) {
        const oldWidth = Math.round(ATS_MIMIC_WIDTH * liveMapZoom);
        pendingLiveMapZoomAnchor = {
          oldWidth,
          centerRatio: (scroll.scrollLeft + (scroll.clientWidth / 2)) / Math.max(1, oldWidth),
        };
      }
      liveMapZoom = Math.max(0.55, Math.min(1.8, nextZoom));
      if (latestLiveMapData) renderLiveMap(latestLiveMapData);
    }

    function renderLiveMap(data) {

      const previousScroll = liveMapView.querySelector('.mimic-scroll')?.scrollLeft || 0;
      const scaledWidth = Math.round(ATS_MIMIC_WIDTH * liveMapZoom);
      const sourceStations = Array.isArray(data.stations) ? data.stations : [];
      const trains = Array.isArray(data.trains) ? data.trains : [];
      const trainPlacements = trains.map((train) => {
        const x = projectTrainX(train, sourceStations);
        const direction = train.direction === 'west' ? 'west' : 'east';
        return { ...train, x, y: direction === 'west' ? ATS_RENDER_TRACK_1_Y : ATS_RENDER_TRACK_2_Y, direction, blockIndex: blockIndexForX(x) };
      });
      const occupied = new Set(trainPlacements.map((train) => `${train.direction}-${train.blockIndex}`));
      const blocksHtml = ['west', 'east'].map((direction) => {
        const y = direction === 'west' ? ATS_RENDER_TRACK_1_Y : ATS_RENDER_TRACK_2_Y;
        const prefix = direction === 'west' ? 'U' : 'L';
        return ATS_RENDER_STATIONS.slice(0, -1).map((_, index) => {
          const x1 = stationX(index) + 14;
          const x2 = stationX(index + 1) - 14;
          const isOccupied = occupied.has(`${direction}-${index}`);
          const labelX = (x1 + x2) / 2;
          const blockLabel = `${prefix}${String(index + 101)}`;
          return `
            <line x1="${x1}" y1="${y}" x2="${x2}" y2="${y}" stroke="${isOccupied ? '#17c6c1' : '#eef3f6'}" stroke-width="3" stroke-linecap="square" />
            <rect x="${labelX - 17}" y="${y + (direction === 'west' ? -25 : 13)}" width="34" height="13" fill="#1c252c" stroke="#9ba6ad" stroke-width="1" />

            <circle cx="${x2 - 4}" cy="${y - 7}" r="2.6" fill="#c9161d" stroke="#230d10" stroke-width="1" />
          `;
        }).join('');
      }).join('');
      const stationHtml = ATS_RENDER_STATIONS.map((station, index) => {
        const x = stationX(index);
        const labelLines = station.label.map((line, lineIndex) => (
          `<tspan x="${x}" dy="${lineIndex ? 12 : 0}">${escapeHtml(line)}</tspan>`
        )).join('');
        return `
          <line x1="${x}" y1="${ATS_RENDER_TRACK_1_Y - 22}" x2="${x}" y2="${ATS_RENDER_TRACK_2_Y + 22}" stroke="#cbd2d8" stroke-width="1" opacity=".72" />
          <rect x="${x - 6}" y="${ATS_RENDER_TRACK_1_Y - 15}" width="12" height="30" fill="#46515a" stroke="#eef3f6" stroke-width="1.5" />
          <rect x="${x - 6}" y="${ATS_RENDER_TRACK_2_Y - 15}" width="12" height="30" fill="#46515a" stroke="#eef3f6" stroke-width="1.5" />

          <text x="${x}" y="${ATS_RENDER_TRACK_2_Y + 42}" fill="#e1e6ea" font-size="9" text-anchor="middle">${escapeHtml(station.code)}</text>
        `;

      const trainHtml = trainPlacements.map((train, index) => {
        const label = train.blockId || String(index + 101);
        const arrowText = train.direction === 'west' ? '<-' : '->';
        const status = trainStatusFor(train, index);

        return `
          <g class="ats-train-hit" data-open-paddle="${escapeHtml(paddleId)}" data-day="${escapeHtml(serviceDay)}" data-open-source="map">

      const activeRows = trainPlacements.map((train, index) => {

      const clock = new Date().toLocaleString('en-CA', { timeZone, weekday: 'short', month: 'short', day: '2-digit', hour: '2-digit', minute: '2-digit', second: '2-digit' });

      liveMapView.innerHTML = `

          <div class="ats-clock">${escapeHtml(clock)}</div>

      if (!chat.hidden) addPaddleCard(data);
      openPaddleModal(data, source);
      setStatus('Paddle ready', true);
      return data;
    }

    chatForm.addEventListener('submit', async (event) => {
      event.preventDefault();
      const message = chatInput.value.trim();
      if (!message) return;
      if (message.toLowerCase() === 'clear') {
        chatInput.value = '';
        stopLiveMapRefresh();
        resetChat();
        return;
      }
      addMessage(normalizePaddleId(message), 'user');
      chatInput.value = '';
      try {
        await runLookup(message);
      } catch (error) {
        addMessage(error.message || 'Lookup failed.');
        setStatus('Lookup failed', false);
      }
    });

    clearBtn.addEventListener('click', () => {
      resetChat();
    });

    homeBtn.addEventListener('click', () => {
      showToolView('Ready');
    });

    myWorkBtn.addEventListener('click', async () => {
      try {
        await openMyWorkPage();
      } catch (error) {
        myWorkView.hidden = false;
        myWorkView.innerHTML = `<div class="live-map-error">${escapeHtml(error.message || 'My Work failed.')}</div>`;
        setStatus('My Work failed', false);
      }
    });

    todaysPaddleBtn.addEventListener('click', async () => {
      try {
        await openTodaysPaddlePage();
      } catch (error) {
        todaysPaddleView.hidden = false;
        todaysPaddleView.innerHTML = `<div class="live-map-error">${escapeHtml(error.message || "Today's Paddle failed.")}</div>`;
        setStatus("Today's paddle failed", false);
      }
    });

    lrvDefectsBtn.addEventListener('click', async () => {
      try {
        await openLrvDefectsPage();
      } catch (error) {
        lrvDefectsView.hidden = false;
        lrvDefectsView.innerHTML = `<div class="live-map-error">${escapeHtml(error.message || 'LRV Defects failed. Apply the Supabase schema if this is the first setup.')}</div>`;
        setStatus('Defects failed', false);
      }
    });

    liveMapBtn.addEventListener('click', async () => {
      try {
        await openLiveMap();
      } catch (error) {
        liveMapView.hidden = false;
        liveMapView.innerHTML = `<div class="live-map-error">${escapeHtml(error.message || 'Live Map failed.')}</div>`;
        setStatus('Map failed', false);
      }
    });

    todayBoardBtn.addEventListener('click', async () => {
      try {
        await openTodayBoard();
      } catch (error) {
        todayBoardView.hidden = false;
        todayBoardView.innerHTML = `<div class="live-map-error">${escapeHtml(error.message || 'Today Board failed.')}</div>`;
        setStatus('Board failed', false);
      }
    });

    demoBtn.addEventListener('click', openDemoPage);

    accountBtn.addEventListener('click', () => {
      openAccountModal();
    });

    closePaddleBtn.addEventListener('click', closePaddleModal);
    jumpToCurrentBtn.addEventListener('click', jumpToCurrentPaddlePosition);
    closeAccountBtn.addEventListener('click', closeAccountModal);
    paddleOverlay.addEventListener('click', (event) => {
      if (event.target === paddleOverlay) closePaddleModal();
    });
    accountOverlay.addEventListener('click', (event) => {
      if (event.target === accountOverlay) closeAccountModal();
    });

    refreshCountdowns();
    renderOcMetaBar();
    setInterval(refreshCountdowns, 1000);
    registerServiceWorker();
    initSupabase();

    document.addEventListener('click', async (event) => {
      const exitLiveMapBtn = event.target.closest('[data-exit-live-map]');
      if (exitLiveMapBtn) {
        exitLiveMap();
        return;
      }

      const zoomBtn = event.target.closest('[data-map-zoom]');
      if (zoomBtn) {
        const action = zoomBtn.dataset.mapZoom;
        if (action === 'in') setLiveMapZoom(liveMapZoom + 0.15);
        if (action === 'out') setLiveMapZoom(liveMapZoom - 0.15);
        if (action === 'fit') {
          pendingLiveMapZoomAnchor = null;
          liveMapZoom = 1;
          if (latestLiveMapData) {
            renderLiveMap(latestLiveMapData);
            const scroll = liveMapView.querySelector('.mimic-scroll');
            if (scroll) scroll.scrollLeft = 0;
          }
        }
        return;
      }

      const inlinePaddleJumpBtn = event.target.closest('[data-inline-paddle-jump]');
      if (inlinePaddleJumpBtn) {
        handleInlinePaddleJump(inlinePaddleJumpBtn);
        return;
      }

      const openPaddleBtn = event.target.closest('[data-open-paddle]');
      if (openPaddleBtn) {
        try {
          await openPaddle(
            openPaddleBtn.dataset.openPaddle,
            openPaddleBtn.dataset.day || '',
            openPaddleBtn.dataset.openSource || 'lookup'
          );
        } catch (error) {
          addMessage(error.message || 'Paddle lookup failed.');
          setStatus('Lookup failed', false);
        }
        return;
      }

      const openAccountModalBtn = event.target.closest('[data-open-account-modal]');
      if (openAccountModalBtn) {
        openAccountModal();
        return;
      }

      const submitLrvDefectBtn = event.target.closest('#submitLrvDefectBtn');
      if (submitLrvDefectBtn) {
        await submitLrvDefectReport();
        return;
      }

      const grantLrvAccessBtn = event.target.closest('#grantLrvAccessBtn');
      if (grantLrvAccessBtn) {
        await grantLrvDefectAccess();
        return;
      }

      const revokeLrvAccessBtn = event.target.closest('[data-revoke-lrv-access]');
      if (revokeLrvAccessBtn) {
        await revokeLrvDefectAccess(revokeLrvAccessBtn.dataset.revokeLrvAccess || '');
        return;
      }

      const deleteLrvReportBtn = event.target.closest('[data-delete-lrv-report]');
      if (deleteLrvReportBtn) {
        await deleteLrvDefectReport(deleteLrvReportBtn.dataset.deleteLrvReport || '');
        return;
      }

      const editLrvReportBtn = event.target.closest('[data-edit-lrv-report]');
      if (editLrvReportBtn) {
        editingLrvReportId = editLrvReportBtn.dataset.editLrvReport || '';
        await renderLrvDefectsPage();
        return;
      }

      const saveLrvReportBtn = event.target.closest('[data-save-lrv-report]');
      if (saveLrvReportBtn) {
        await saveLrvDefectReportEdit(saveLrvReportBtn.dataset.saveLrvReport || '');
        return;
      }

      const cancelEditLrvReportBtn = event.target.closest('[data-cancel-edit-lrv-report]');
      if (cancelEditLrvReportBtn) {
        editingLrvReportId = '';
        await renderLrvDefectsPage();
        return;
      }

      const exportLrvDefectsBtn = event.target.closest('[data-export-lrv-defects]');
      if (exportLrvDefectsBtn) {
        await exportLrvDefectReports(exportLrvDefectsBtn.dataset.exportLrvDefects || 'current');
        return;
      }

      const saveTodaysPaddleBtn = event.target.closest('[data-save-todays-paddle]');
      if (saveTodaysPaddleBtn) {
        const paddleId = saveTodaysPaddleBtn.dataset.saveTodaysPaddle || '';
        const serviceDay = saveTodaysPaddleBtn.dataset.day || '';
        if (currentLookup && currentLookup.paddleId === paddleId && currentLookup.serviceDay === serviceDay) {
          saveToTodaysPaddle(currentLookup);
          addPaddleCard(currentLookup);
          setStatus("Saved to today's paddle", true);
          showToast("Saved to Today's Paddle", `${paddleId} will open here for the rest of today.`);
        }
        return;
      }

      const sameWorkScheduleToggle = event.target.closest('#sameWorkScheduleToggle');
      if (sameWorkScheduleToggle) {
        setDraftSameWork(sameWorkScheduleToggle.checked);
        const saved = await persistMyWorkDraft('My Work updated');
        await renderMyWorkPage();
        if (saved) showToast('My Work updated', sameWorkScheduleToggle.checked ? 'Week 1 and Week 2 now use the same paddles.' : 'Week 1 and Week 2 can now be saved separately.');
        return;
      }

      const addMyWorkDayBtn = event.target.closest('[data-add-my-work-day]');
      if (addMyWorkDayBtn) {
        const serviceDay = addMyWorkDayBtn.dataset.addMyWorkDay || '';
        const weekKey = addMyWorkDayBtn.dataset.week || getCurrentWorkWeekKey();
        const input = document.getElementById(`${weekKey}_${serviceDay}PaddleInput`);
        const result = addPaddleToMyWorkDraft(serviceDay, input?.value || '', weekKey);
        if (!result.ok) {
          setStatus(result.error, false);
          return;
        }
        const saved = await persistMyWorkDraft('Paddle added to My Work');
        await renderMyWorkPage();
        if (saved) showToast('Saved to My Work', `${result.paddleId} was saved.`);
        return;
      }

      const removeMyWorkDraftBtn = event.target.closest('[data-remove-my-work-draft]');
      if (removeMyWorkDraftBtn) {
        const paddleId = removeMyWorkDraftBtn.dataset.removeMyWorkDraft || '';
        removePaddleFromMyWorkDraft(removeMyWorkDraftBtn.dataset.day || '', paddleId, removeMyWorkDraftBtn.dataset.week || getCurrentWorkWeekKey());
        const saved = await persistMyWorkDraft('Paddle removed from My Work');
        await renderMyWorkPage();
        if (saved) showToast('Removed from My Work', `${paddleId} was removed.`);
        return;
      }

      const saveMyWorkBtn = event.target.closest('[data-save-my-work]');
      if (saveMyWorkBtn) {
        const paddleId = saveMyWorkBtn.dataset.saveMyWork || '';
        const serviceDay = saveMyWorkBtn.dataset.day || '';
        const saved = await savePaddleToMyWork(paddleId, serviceDay);
        if (saved) {
          if (currentLookup && currentLookup.paddleId === paddleId && currentLookup.serviceDay === serviceDay && !chat.hidden) {
            addPaddleCard(currentLookup);
          }
          if (!todaysPaddleView.hidden) {
            await renderTodaysPaddlePage();
          }
          if (!myWorkView.hidden) {
            await renderMyWorkPage();
          }
        }
        return;
      }

      const removeTodaysPaddleBtn = event.target.closest('[data-remove-todays-paddle]');
      if (removeTodaysPaddleBtn) {
        removeFromTodaysPaddle(removeTodaysPaddleBtn.dataset.removeTodaysPaddle || '', removeTodaysPaddleBtn.dataset.day || '');
        await renderTodaysPaddlePage();
        setStatus("Removed from today's paddle", true);
        return;
      }

      const removeMyWorkBtn = event.target.closest('[data-remove-my-work]');
      if (removeMyWorkBtn) {
        await removePaddleFromMyWork(removeMyWorkBtn.dataset.removeMyWork || '', removeMyWorkBtn.dataset.day || '');
        if (!myWorkView.hidden) {
          await renderMyWorkPage();
        }
        if (!todaysPaddleView.hidden) {
          await renderTodaysPaddlePage();
        }
        if (currentLookup && !chat.hidden) {
          addPaddleCard(currentLookup);
        }
        return;
      }

    });

    document.addEventListener('change', async (event) => {
      const roleSelect = event.target?.closest?.('[data-update-lrv-access-role]');
      if (roleSelect) {
        await updateLrvDefectAccessRole(roleSelect.dataset.updateLrvAccessRole || '', roleSelect.value || 'reporter');
        return;
      }
      const reportStatusSelect = event.target?.closest?.('[data-update-lrv-report-status]');
      if (reportStatusSelect) {
        await updateLrvDefectReportStatus(reportStatusSelect.dataset.updateLrvReportStatus || '', reportStatusSelect.value || 'open');
        return;
      }
      const editCategorySelect = event.target?.closest?.('[data-edit-report-category]');
      if (editCategorySelect) {
        const id = editCategorySelect.dataset.editReportCategory || '';
        const category = editCategorySelect.value || 'other';
        const seatWrap = document.getElementById(`editSeatWrap_${id}`);
        const thermoWrap = document.getElementById(`editThermoWrap_${id}`);
        if (seatWrap) seatWrap.hidden = category !== 'seat_issue';
        if (thermoWrap) thermoWrap.hidden = category !== 'thermo_king';
        return;
      }
      if (event.target?.id === 'lrvLookupNumber') {
        selectedLrvNumber = Number(event.target.value || selectedLrvNumber);
        await renderLrvDefectsPage();
        return;
      }
      if (event.target?.id === 'lrvReportNumber') {
        selectedLrvNumber = Number(event.target.value || selectedLrvNumber);
        return;
      }
      if (event.target?.id === 'lrvReportCab') {
        selectedLrvCab = event.target.value || selectedLrvCab;
      }
      if (event.target?.id === 'lrvDefectCategory') {
        selectedLrvDefectCategory = event.target.value || selectedLrvDefectCategory;
        const seatWrap = document.getElementById('lrvSeatIssueDetailWrap');
        const thermoWrap = document.getElementById('lrvThermoKingModeWrap');
        if (seatWrap) seatWrap.hidden = selectedLrvDefectCategory !== 'seat_issue';
        if (thermoWrap) thermoWrap.hidden = selectedLrvDefectCategory !== 'thermo_king';
        return;
      }
      if (event.target?.id === 'lrvSeatIssueDetail') {
        selectedLrvSeatIssueDetail = event.target.value || selectedLrvSeatIssueDetail;
        return;
      }
      if (event.target?.id === 'lrvThermoKingMode') {
        selectedLrvThermoKingMode = event.target.value || selectedLrvThermoKingMode;
        return;
      }
      if (event.target?.id === 'lrvExportFromDate') {
        lrvExportFromDate = event.target.value || '';
        normalizeExportDateInputs();
        refreshLrvDefectAdminPanel();
        return;
      }
      if (event.target?.id === 'lrvExportToDate') {
        lrvExportToDate = event.target.value || '';
        normalizeExportDateInputs();
        refreshLrvDefectAdminPanel();
      }
    });

    liveMapView.addEventListener('click', (event) => {
      if (event.target.closest('[data-exit-live-map]')) {
        event.stopPropagation();
        exitLiveMap();
      }
    });
  </script>
</body>
</html>
