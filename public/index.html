<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ERO Operator Tools</title>
  <meta name="theme-color" content="#14171d">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="ERO Tool">
  <link rel="manifest" href="/manifest.webmanifest">
  <style>
    :root {
      --bg: #14171d;
      --panel: #1c2128;
      --panel-2: #11161c;
      --border: rgba(255,255,255,0.11);
      --text: #f2f4f8;
      --muted: #bcc6d4;
      --accent: #d9472f;
      --accent-2: #ffb068;
      --chip: #0f1622;
    }
    * { box-sizing: border-box; }
    html {
      width: 100%;
      overflow-x: hidden;
    }
    body {
      margin: 0;
      font-family: "Segoe UI", system-ui, sans-serif;
      background:
        radial-gradient(circle at top left, rgba(217,71,47,.18), transparent 35%),
        linear-gradient(180deg, #181b22 0%, #13171d 100%);
      color: var(--text);
      min-height: 100vh;
    }
    .app {
      width: min(1180px, calc(100vw - 24px));
      margin: 16px auto;
      border: 1px solid var(--border);
      border-radius: 24px;
      overflow: hidden;
      background: rgba(24,28,35,.92);
      backdrop-filter: blur(10px);
      min-height: calc(100vh - 32px);
      display: grid;
      grid-template-rows: auto auto 1fr;
    }
    .app.map-mode {
      width: 100vw;
      min-height: 100vh;
      min-height: 100dvh;
      margin: 0;
      border: 0;
      border-radius: 0;
    }
    .app.map-mode > .header {
      display: none;
    }
    .app.map-mode > .oc-meta-bar {
      display: none;
    }
    .oc-meta-bar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px 12px;
      padding: 8px 22px;
      border-bottom: 1px solid var(--border);
      background: linear-gradient(90deg, rgba(255,255,255,.055), rgba(255,255,255,.02));
    }
    .oc-meta-pill {
      display: inline-flex;
      align-items: center;
      min-height: 28px;
      padding: 5px 10px;
      border: 1px solid rgba(255,255,255,.14);
      border-radius: 999px;
      background: rgba(255,255,255,.04);
      font-size: 12px;
      line-height: 1.2;
      white-space: nowrap;
      color: var(--text);
      font-weight: 650;
    }
    .header {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 18px;
      align-items: center;
      padding: 22px;
      border-bottom: 1px solid var(--border);
      background: linear-gradient(180deg, rgba(71,24,18,.5), rgba(28,33,40,.92));
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 14px;
    }
    .brand-badge {
      width: 44px;
      height: 44px;
      border-radius: 12px;
      background: linear-gradient(180deg, #c53524, #8d2418);
      display: grid;
      place-items: center;
      font-weight: 800;
    }
    .brand h1 {
      margin: 0;
      font-size: 18px;
    }
    .brand p {
      margin: 4px 0 0;
      color: var(--muted);
      font-size: 14px;
    }
    .header-nav {
      display: grid;
      gap: 10px;
      justify-items: end;
    }
    .header-actions,
    .header-utility {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      justify-content: flex-end;
      align-items: center;
    }
    .header-btn, .search-btn, .link-btn, .save-btn {
      appearance: none;
      border: 1px solid rgba(255,255,255,.14);
      background: rgba(10,14,20,.45);
      color: var(--text);
      border-radius: 999px;
      padding: 10px 14px;
      font: inherit;
      cursor: pointer;
    }
    .header-btn.is-primary {
      background: rgba(217, 71, 47, 0.16);
      border-color: rgba(255, 176, 104, 0.24);
      color: #ffe0c2;
    }
    .header-btn.is-active {
      background: linear-gradient(180deg, rgba(217,71,47,.28), rgba(217,71,47,.16));
      border-color: rgba(255,176,104,.32);
      color: #fff5ea;
      box-shadow: inset 0 0 0 1px rgba(255,255,255,.03);
    }
    .status-pill {
      border-color: rgba(116, 255, 173, .22);
      color: #74ffad;
    }
    .my-work {
      padding: 14px 22px;
      border-bottom: 1px solid var(--border);
    }
    .my-work h2 {
      margin: 0 0 10px;
      font-size: 12px;
      letter-spacing: .08em;
      text-transform: uppercase;
      color: var(--muted);
    }
    .saved-list, .day-actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }
    .field-grid {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 12px;
      align-items: end;
    }
    .select-input {
      width: 100%;
      border-radius: 14px;
      border: 1px solid rgba(255,255,255,.12);
      background: rgba(30, 36, 44, .92);
      color: var(--text);
      padding: 13px 14px;
      font: inherit;
      min-height: 48px;
    }
    .saved-chip, .day-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 9px 13px;
      border: 1px solid rgba(164, 192, 255, 0.18);
      border-radius: 999px;
      background: var(--chip);
      color: #a9c6ff;
      font-size: 14px;
    }
    .saved-chip.is-work-chip {
      color: var(--text);
      border-color: rgba(255,255,255,.14);
    }
    .chip-remove {
      appearance: none;
      border: 0;
      background: transparent;
      color: inherit;
      cursor: pointer;
      font: inherit;
    }
    .main {
      display: grid;
      grid-template-rows: 1fr auto;
      min-height: 0;
    }
    .composer {
      padding: 14px 22px 16px;
      border-top: 1px solid var(--border);
      background:
        linear-gradient(180deg, rgba(17,22,28,.74), rgba(17,22,28,.98)),
        radial-gradient(circle at right, rgba(217,71,47,.12), transparent 42%);
    }
    .composer form {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 12px;
      align-items: end;
    }
    .composer input {
      width: 100%;
      border-radius: 18px;
      border: 1px solid rgba(255,255,255,.12);
      background: rgba(30, 36, 44, .92);
      color: var(--text);
      padding: 15px 18px;
      font: inherit;
      min-height: 54px;
    }
    .live-map-view {
      grid-row: 1 / -1;
      padding: 0;
      overflow: auto;
      min-height: 100vh;
      min-height: 100dvh;
      background: #d9dde1;
      color: #101418;
      font-family: "Consolas", "Lucida Console", monospace;
      -webkit-overflow-scrolling: touch;
    }
    .tool-page-view,
    .today-board-screen {
      padding: 22px;
      overflow: auto;
      min-height: 0;
      background:
        radial-gradient(circle at 15% 0%, rgba(255,176,104,.10), transparent 36%),
        linear-gradient(180deg, rgba(18,23,30,.98), rgba(13,17,23,.98));
    }
    .board-page-head {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 16px;
      margin-bottom: 16px;
    }
    .board-page-head h2 {
      margin: 0;
      font-size: clamp(28px, 4vw, 54px);
      line-height: .95;
      letter-spacing: -.04em;
    }
    .board-page-head p {
      margin: 8px 0 0;
      color: var(--muted);
    }
    .board-page-meta {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }
    .board-stat {
      min-width: 92px;
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 9px 11px;
      background: rgba(255,255,255,.025);
      text-align: right;
    }
    .board-stat .k {
      display: block;
      color: var(--muted);
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: .08em;
    }
    .board-stat .v {
      display: block;
      margin-top: 2px;
      color: var(--text);
      font-size: 20px;
      font-weight: 800;
    }
    .saved-paddles-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 14px;
      align-items: start;
    }
    .saved-empty {
      border: 1px dashed rgba(255,255,255,.14);
      border-radius: 16px;
      padding: 18px;
      color: var(--muted);
      background: rgba(255,255,255,.02);
    }
    .ats-head {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 0;
      padding: 8px 12px;
      border-bottom: 1px solid #aeb6bd;
      background: #e8ecef;
      color: #11161b;
    }
    .ats-logo {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 128px;
      height: 36px;
      background: #d71920;
      color: white;
      font: 900 18px "Segoe UI", sans-serif;
      letter-spacing: -.03em;
    }
    .ats-head h2 {
      flex: 1;
      margin: 0;
      font: 800 22px "Consolas", "Lucida Console", monospace;
      letter-spacing: .03em;
    }
    .ats-clock {
      min-width: 145px;
      text-align: center;
      border-left: 1px solid #b8c0c7;
      border-right: 1px solid #b8c0c7;
      font-size: 13px;
      line-height: 1.18;
      padding: 0 12px;
    }
    .ats-state {
      display: grid;
      grid-template-columns: repeat(3, 120px);
      text-align: center;
      font: 800 12px "Segoe UI", sans-serif;
      text-transform: uppercase;
    }
    .ats-state div {
      border-right: 1px solid #b8c0c7;
      padding: 3px 8px;
    }
    .ats-state strong {
      display: block;
      color: #11751f;
      margin-top: 3px;
    }
    .mimic-alert {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      padding: 7px 12px;
      background: #b90f18;
      color: white;
      font: 800 13px "Segoe UI", sans-serif;
    }
    .mimic-alert button {
      border: 0;
      border-radius: 4px;
      background: #f5f7f9;
      color: #1d242b;
      padding: 7px 18px;
      font-weight: 800;
    }
    .ats-toolbar {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 5px 10px;
      background: #d6dbe0;
      border-bottom: 1px solid #aeb6bd;
      font: 700 11px "Consolas", "Lucida Console", monospace;
      color: #1c252d;
    }
    .tool-cell {
      min-height: 20px;
      display: inline-flex;
      align-items: center;
      border-left: 1px solid #9aa4ad;
      padding: 0 10px;
      letter-spacing: .03em;
    }
    .zoom-controls {
      margin-left: auto;
      display: inline-flex;
      align-items: center;
      border: 1px solid #9aa4ad;
      background: #eef1f4;
    }
    .zoom-controls button,
    .zoom-controls span {
      min-width: 42px;
      height: 24px;
      display: inline-grid;
      place-items: center;
      border: 0;
      border-right: 1px solid #9aa4ad;
      background: transparent;
      color: #1c252d;
      font: 800 11px "Consolas", "Lucida Console", monospace;
    }
    .zoom-controls button {
      cursor: pointer;
    }
    .zoom-controls button:hover {
      background: #dfe5ea;
    }
    .zoom-controls button:last-child {
      border-right: 0;
      min-width: 50px;
    }
    .mimic-nav-btn {
      border: 1px solid #8e99a2;
      background: #f6f8fa;
      color: #111820;
      height: 24px;
      padding: 0 10px;
      font: 900 11px "Consolas", "Lucida Console", monospace;
      cursor: pointer;
    }
    .mimic-nav-btn:hover {
      background: #dfe5ea;
    }
    .tool-sep {
      height: 28px;
      width: 1px;
      background: #aeb6bd;
      margin: 0 5px;
    }
    .mimic-scroll {
      overflow-x: auto;
      overflow-y: hidden;
      background: #46515a;
      -webkit-overflow-scrolling: touch;
      overscroll-behavior-x: contain;
    }
    .ats-svg {
      display: block;
      width: 2720px;
      height: 430px;
      background: #46515a;
      font-family: "Consolas", "Lucida Console", monospace;
    }
    .ats-train-hit {
      cursor: pointer;
    }
    .ats-train-hit rect {
      shape-rendering: crispEdges;
    }
    .ats-train-hit:hover rect:first-child {
      stroke: #fff7b0;
      stroke-width: 2;
    }
    .ats-panels {
      display: grid;
      grid-template-columns: minmax(0, 1.6fr) minmax(220px, .65fr) minmax(260px, .75fr);
      gap: 6px;
      padding: 6px;
      background: #d9dde1;
      color: #12171d;
    }
    .ats-panel {
      min-height: 145px;
      border: 1px solid #98a2aa;
      background: #eef1f4;
    }
    .ats-panel h3 {
      margin: 0;
      padding: 6px 8px;
      border-bottom: 1px solid #aeb6bd;
      font: 800 13px "Segoe UI", sans-serif;
      text-transform: uppercase;
    }
    .ats-table {
      width: 100%;
      border-collapse: collapse;
      font: 12px "Segoe UI", sans-serif;
    }
    .ats-table th,
    .ats-table td {
      border-right: 1px solid #c6ccd2;
      border-bottom: 1px solid #c6ccd2;
      padding: 4px 6px;
      text-align: left;
    }
    .legend-row,
    .control-row,
    .note-row {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 8px;
      font: 12px "Segoe UI", sans-serif;
    }
    .legend-swatch {
      width: 42px;
      height: 4px;
      background: #e8edf2;
      border: 1px solid #6e7880;
    }
    .legend-swatch.occ { background: #18bfc1; }
    .legend-swatch.blocked { background: #d20d17; }
    .ats-panels .ats-panel:nth-child(3) .note-row:nth-of-type(n+4) {
      display: none;
    }
    .live-map-error {
      margin-top: 14px;
      border: 1px solid rgba(255,176,104,.25);
      border-radius: 16px;
      padding: 14px;
      color: var(--accent-2);
      background: rgba(255,176,104,.06);
    }
    .search-btn {
      background: linear-gradient(180deg, #de4a31, #bc301f);
      border-color: rgba(255,255,255,.08);
      min-width: 108px;
      font-weight: 700;
    }
    .chat {
      padding: 18px 22px 20px;
      overflow: auto;
      display: flex;
      flex-direction: column;
      gap: 16px;
      min-height: 0;
      scroll-behavior: smooth;
    }
    .message {
      max-width: min(760px, 100%);
      padding: 18px 18px;
      border: 1px solid var(--border);
      border-radius: 18px;
      background: rgba(31,36,44,.92);
      white-space: pre-wrap;
      line-height: 1.45;
    }
    .message.intro {
      max-width: min(760px, 100%);
      padding: 20px 22px;
      background:
        linear-gradient(135deg, rgba(31,36,44,.96), rgba(17,22,28,.9)),
        radial-gradient(circle at left top, rgba(255,176,104,.08), transparent 36%);
      text-align: left;
      white-space: normal;
    }
    .message.intro strong {
      color: var(--text);
    }
    .message.user {
      align-self: flex-end;
      background: linear-gradient(180deg, #d9472f, #bd321f);
      border-color: rgba(255,255,255,.08);
    }
    .card {
      max-width: min(980px, 100%);
      border: 1px solid var(--border);
      border-radius: 20px;
      background: rgba(17,22,28,.95);
      overflow: hidden;
    }
    .board-card {
      max-width: min(1040px, 100%);
    }
    .board-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
      gap: 14px;
      padding: 0 18px 18px;
    }
    .board-section {
      border: 1px solid var(--border);
      border-radius: 18px;
      background: rgba(255,255,255,.025);
      overflow: hidden;
      min-height: 170px;
    }
    .board-section h4 {
      margin: 0;
      padding: 13px 14px;
      border-bottom: 1px solid var(--border);
      color: var(--accent-2);
      font-size: 14px;
      letter-spacing: .04em;
      text-transform: uppercase;
    }
    .board-list {
      display: grid;
      gap: 8px;
      padding: 12px;
    }
    .board-empty {
      padding: 14px;
      color: var(--muted);
      font-size: 14px;
    }
    .board-item {
      appearance: none;
      text-align: left;
      border: 1px solid rgba(255,255,255,.09);
      border-radius: 14px;
      background: rgba(17,22,28,.84);
      color: var(--text);
      padding: 10px 11px;
      cursor: pointer;
      font: inherit;
    }
    .board-item strong {
      display: block;
      font-size: 18px;
      margin-bottom: 4px;
    }
    .board-item span {
      display: block;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.35;
    }
    .today-board-screen .board-grid {
      grid-template-columns: repeat(5, minmax(210px, 1fr));
      gap: 12px;
      padding: 0;
      align-items: start;
    }
    .today-board-screen .board-section {
      border-radius: 12px;
      min-height: calc(100vh - 230px);
    }
    .today-board-screen .board-section h4 {
      position: sticky;
      top: 0;
      z-index: 1;
      background: rgba(18,23,30,.98);
    }
    .card-head {
      padding: 18px 18px 12px;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 12px;
    }
    .saved-paddle-inline .card-head {
      position: sticky;
      top: 0;
      z-index: 3;
      background: rgba(24, 28, 35, 0.96);
      backdrop-filter: blur(10px);
    }
    .card-head-right {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }
    .card-head h3 {
      margin: 0;
      font-size: 38px;
      line-height: 1;
      letter-spacing: -.03em;
    }
    .card-head p {
      margin: 6px 0 0;
      color: var(--muted);
    }
    .pill {
      border: 1px solid rgba(255, 176, 104, 0.3);
      color: var(--accent-2);
      padding: 8px 12px;
      border-radius: 999px;
      font-size: 12px;
      white-space: nowrap;
    }
    .card-jump-btn {
      appearance: none;
      border: 1px solid rgba(255,255,255,.14);
      border-radius: 999px;
      background: rgba(9,12,18,.55);
      color: var(--text);
      width: 38px;
      height: 38px;
      cursor: pointer;
      font: inherit;
      font-size: 18px;
      line-height: 1;
      display: inline-grid;
      place-items: center;
    }
    .card-jump-btn:disabled {
      opacity: .45;
      cursor: default;
    }
    .card-body {
      padding: 0 18px 18px;
    }
    .active-box {
      border: 1px solid rgba(255,176,104,.25);
      background: rgba(255,176,104,.05);
      border-radius: 16px;
      padding: 14px 16px;
      margin-bottom: 14px;
    }
    .active-box-head {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 12px;
    }
    .active-box-copy {
      flex: 1;
      min-width: 0;
    }
    .active-box-jump {
      appearance: none;
      border: 1px solid rgba(255,255,255,.14);
      border-radius: 999px;
      background: rgba(9,12,18,.55);
      color: var(--text);
      width: 38px;
      height: 38px;
      cursor: pointer;
      font: inherit;
      font-size: 18px;
      line-height: 1;
      display: inline-grid;
      place-items: center;
      flex: 0 0 auto;
    }
    .active-box-jump:disabled {
      opacity: .45;
      cursor: default;
    }
    .active-box .label {
      font-size: 12px;
      color: var(--muted);
      letter-spacing: .08em;
      text-transform: uppercase;
      margin-bottom: 6px;
    }
    .active-box .title {
      font-size: 28px;
      font-weight: 700;
      line-height: 1.15;
    }
    .action-mimic {
      margin-top: 14px;
      display: grid;
      grid-template-columns: minmax(0, 1fr) 180px minmax(0, 1fr);
      gap: 14px;
      align-items: center;
    }
    .action-mimic .trip-stop {
      font-size: 15px;
    }
    .action-mimic .trip-time {
      font-size: 18px;
    }
    .action-detail {
      margin-top: 6px;
      color: var(--muted);
      line-height: 1.45;
    }
    .action-detail strong {
      color: var(--text);
    }
    .summary-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 12px;
      margin-bottom: 16px;
    }
    .summary-item {
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 12px;
      background: rgba(255,255,255,.02);
    }
    .summary-item .k {
      font-size: 12px;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: .08em;
      margin-bottom: 4px;
    }
    .summary-item .v {
      font-size: 15px;
      font-weight: 600;
    }
    .card-actions, .day-actions {
      margin-top: 12px;
    }
    .day-btn, .save-btn, .link-btn {
      cursor: pointer;
    }
    .overlay {
      position: fixed;
      inset: 0;
      background: rgba(5, 8, 12, 0.74);
      display: grid;
      place-items: center;
      padding: 20px;
      z-index: 50;
    }
    [hidden] {
      display: none !important;
    }
    .modal {
      width: min(1080px, 100%);
      max-height: calc(100vh - 40px);
      background: rgba(24,28,35,.98);

    function normalizePaddleId(value) {
      const text = String(value || '').trim();
      if (/^\d{1,2}$/.test(text)) return `1-${Number(text)}`;
      const match = text.match(/^(\d+)-(\d+)$/);
      if (match) return `${Number(match[1])}-${Number(match[2])}`;
      return text;
    }

    function formatServiceLabel(serviceDay) {
      const map = {
        mon_thu: 'Mon-Thu',
        friday: 'Friday',
        saturday: 'Saturday',
        sunday: 'Sunday',
      };
      return map[serviceDay] || serviceDay;
    }

    function getTorontoDateParts(date) {
      const formatter = new Intl.DateTimeFormat('en-CA', {
        timeZone,
        year: 'numeric',
        month: '2-digit',
        day: '2-digit',
        weekday: 'short',
      });
      const values = {};
      formatter.formatToParts(date).forEach((part) => {
        if (part.type !== 'literal') values[part.type] = part.value;
      });
      return {
        year: Number(values.year),
        month: Number(values.month),
        day: Number(values.day),
        weekday: values.weekday,
      };
    }

    function torontoPartsToUtcMs(parts) {
      return Date.UTC(parts.year, parts.month - 1, parts.day);
    }

    function getWeekNumber(parts = getTorontoDateParts(new Date())) {
      const weekdayIndex = weekdayToIndex[parts.weekday] ?? 0;
      const currentDayUtc = torontoPartsToUtcMs(parts);
      const sundayUtc = currentDayUtc - (weekdayIndex * msPerDay);
      const weekOffset = Math.round((sundayUtc - anchorSundayUtc) / (7 * msPerDay));
      const normalized = (anchorWeek - 1 + weekOffset) % 2;
      return normalized < 0 ? normalized + 3 : normalized + 1;
    }

    function addDaysParts(parts, daysToAdd) {
      const nextUtc = torontoPartsToUtcMs(parts) + (daysToAdd * msPerDay);
      return getTorontoDateParts(new Date(nextUtc + 12 * 60 * 60 * 1000));
    }

    function formatPayDate(parts) {
      return new Intl.DateTimeFormat('en-CA', {
        timeZone,
        month: 'short',
        day: 'numeric',
        year: 'numeric',
      }).format(new Date(Date.UTC(parts.year, parts.month - 1, parts.day, 12)));
    }

    function findNextPayDateParts(todayParts) {
      for (let offset = 0; offset < 28; offset += 1) {
        const candidate = addDaysParts(todayParts, offset);
        if (weekdayToIndex[candidate.weekday] !== thursdayIndex) continue;
        if (getWeekNumber(candidate) !== payWeek) continue;
        return candidate;
      }
      return null;
    }

    function renderOcMetaBar() {
      if (!ocMetaBar) return;
      const todayParts = getTorontoDateParts(new Date());
      const tomorrowParts = addDaysParts(todayParts, 1);
      const payDateParts = findNextPayDateParts(todayParts);
      ocMetaBar.innerHTML = `
        <div class="oc-meta-pill">Today: ${escapeHtml(dayNames[todayParts.weekday] || todayParts.weekday)} ${escapeHtml(getWeekNumber(todayParts))}</div>
        <div class="oc-meta-pill">Tomorrow: ${escapeHtml(dayNames[tomorrowParts.weekday] || tomorrowParts.weekday)} ${escapeHtml(getWeekNumber(tomorrowParts))}</div>
        <div class="oc-meta-pill">Next Pay: ${escapeHtml(payDateParts ? formatPayDate(payDateParts) : 'Unavailable')}</div>
      `;
    }

    function getCurrentServiceDayKey() {
      const weekday = new Intl.DateTimeFormat('en-CA', {
        timeZone,
        weekday: 'short',
      }).format(new Date()).toLowerCase();
      if (weekday === 'fri') return 'friday';
      if (weekday === 'sat') return 'saturday';
      if (weekday === 'sun') return 'sunday';
      return 'mon_thu';
    }

    function getCurrentWorkWeekKey() {
      return `week${getWeekNumber()}`;

    function showToast(title, detail = '') {

      toast.innerHTML = `<strong>${escapeHtml(title)}</strong>${detail ? `<span>${escapeHtml(detail)}</span>` : ''}`;
      toastStack.appendChild(toast);
      window.setTimeout(() => {
        toast.style.opacity = '0';
        toast.style.transform = 'translateY(8px)';
        toast.style.transition = 'opacity 160ms ease, transform 160ms ease';
        window.setTimeout(() => toast.remove(), 180);

    }

    function closePaddleModal() {

    function getOttawaDateKey() {
      const parts = new Intl.DateTimeFormat('en-CA', {
        timeZone,
        year: 'numeric',
        month: '2-digit',
        day: '2-digit',
      }).formatToParts(new Date());
      const lookup = Object.fromEntries(parts.map((part) => [part.type, part.value]));
      return `${lookup.year}-${lookup.month}-${lookup.day}`;
    }

    function readTodaysPaddleStore() {
      try {
        const raw = localStorage.getItem(todaysPaddleStorageKey);
        const parsed = raw ? JSON.parse(raw) : {};
        const today = getOttawaDateKey();
        if (!parsed || typeof parsed !== 'object' || parsed.date !== today) {
          return { date: today, items: [], hiddenMyWorkItems: [] };
        }
        return {
          date: today,
          items: Array.isArray(parsed.items) ? parsed.items : [],
          hiddenMyWorkItems: Array.isArray(parsed.hiddenMyWorkItems) ? parsed.hiddenMyWorkItems : [],
        };
      } catch (_) {
        return { date: getOttawaDateKey(), items: [], hiddenMyWorkItems: [] };
      }
    }

    function writeTodaysPaddleStore(store) {
      try {
        localStorage.setItem(todaysPaddleStorageKey, JSON.stringify(store));
      } catch (_) {
        // keep working without storage if blocked
      }
    }

    function isSavedToTodaysPaddle(paddleId, serviceDay) {
      const store = readTodaysPaddleStore();
      return store.items.some((item) => item.paddleId === paddleId && item.serviceDay === serviceDay);
    }

    function saveToTodaysPaddle(data) {
      const store = readTodaysPaddleStore();
      const items = store.items.filter((item) => !(item.paddleId === data.paddleId && item.serviceDay === data.serviceDay));
      const hiddenMyWorkItems = (store.hiddenMyWorkItems || []).filter((item) => !(item.paddleId === data.paddleId && item.serviceDay === data.serviceDay));
      items.unshift({
        paddleId: data.paddleId,
        serviceDay: data.serviceDay,
        savedAt: new Date().toISOString(),
        source: 'manual',
      });
      writeTodaysPaddleStore({ date: store.date, items, hiddenMyWorkItems });
    }

    function removeFromTodaysPaddle(paddleId, serviceDay) {
      const store = readTodaysPaddleStore();
      const removed = store.items.find((item) => item.paddleId === paddleId && item.serviceDay === serviceDay);
      const items = store.items.filter((item) => !(item.paddleId === paddleId && item.serviceDay === serviceDay));
      const hiddenMyWorkItems = [...(store.hiddenMyWorkItems || [])];
      if (removed?.source === 'my_work' && !hiddenMyWorkItems.some((item) => item.paddleId === paddleId && item.serviceDay === serviceDay)) {
        hiddenMyWorkItems.push({ paddleId, serviceDay, hiddenAt: new Date().toISOString() });
      }
      writeTodaysPaddleStore({ date: store.date, items, hiddenMyWorkItems });
    }

    function hasTodaysPaddleItems() {
      const store = readTodaysPaddleStore();
      return Array.isArray(store.items) && store.items.length > 0;
    }

    function syncTodaysPaddleFromMyWork() {
      if (!currentProfile) return false;
      const serviceDay = getCurrentServiceDayKey();
      const workWeek = getCurrentWorkWeekKey();
      const todayPaddles = getSavedProfilePaddles(serviceDay);
      const store = readTodaysPaddleStore();
      const hiddenMyWorkKeys = new Set((store.hiddenMyWorkItems || [])
        .filter((item) => item && item.serviceDay === serviceDay)
        .map((item) => `${item.serviceDay}:${item.paddleId}`));
      const manualItems = (store.items || []).filter((item) => {
        if (!item || typeof item !== 'object') return false;
        if (item.source === 'my_work' && item.serviceDay === serviceDay) return false;
        return true;
      });
      const seen = new Set();
      const myWorkItems = todayPaddles.map((paddleId) => ({
        paddleId,
        serviceDay,
        workWeek,
        savedAt: new Date().toISOString(),
        source: 'my_work',
      })).filter((item) => {
        const key = `${item.serviceDay}:${item.paddleId}`;
        if (hiddenMyWorkKeys.has(key)) return false;
        if (seen.has(key)) return false;
        seen.add(key);
        return true;
      });
      const mergedManualItems = manualItems.filter((item) => {
        const key = `${item.serviceDay}:${item.paddleId}`;
        if (seen.has(key)) return false;
        seen.add(key);
        return true;
      });
      writeTodaysPaddleStore({
        date: store.date,
        items: [...myWorkItems, ...mergedManualItems],
        hiddenMyWorkItems: store.hiddenMyWorkItems || [],
      });
      return myWorkItems.length > 0;
    }

    async function maybeOpenTodaysPaddleOnBoot() {
      if (accountRecoveryMode) return;
      syncTodaysPaddleFromMyWork();
      if (!hasTodaysPaddleItems()) return;
      await openTodaysPaddlePage();
    }

    function profileColumnForServiceDay(serviceDay) {
      const map = {
        mon_thu: 'mon_thu_paddles',
        friday: 'friday_paddles',
        saturday: 'saturday_paddles',
        sunday: 'sunday_paddles',
      };
      return map[serviceDay] || 'mon_thu_paddles';
    }

    function weekProfileColumnForServiceDay(weekKey, serviceDay) {
      return `${weekKey}_${profileColumnForServiceDay(serviceDay)}`;
    }

    function getProfileArray(key) {
      return Array.isArray(currentProfile?.[key]) ? currentProfile[key] : [];
    }

    function hasWeekWorkColumns() {
      if (!currentProfile) return false;
      return workWeeks.some((week) => serviceDays.some((day) => Array.isArray(currentProfile[weekProfileColumnForServiceDay(week.key, day.key)])));
    }

    function isSameWorkSchedule() {
      if (!currentProfile) return true;
      if (typeof currentProfile.same_work_schedule === 'boolean') return currentProfile.same_work_schedule;
      return !hasWeekWorkColumns();
    }

    function getSavedProfilePaddles(serviceDay, weekKey = getCurrentWorkWeekKey()) {
      if (!currentProfile) return [];
      const legacyItems = getProfileArray(profileColumnForServiceDay(serviceDay));
      if (!hasWeekWorkColumns()) return legacyItems;
      if (isSameWorkSchedule()) {
        const sameItems = getProfileArray(weekProfileColumnForServiceDay('week1', serviceDay));
        return sameItems.length ? sameItems : legacyItems;
      }
      return getProfileArray(weekProfileColumnForServiceDay(weekKey, serviceDay));
    }

    function applyMyWorkDraftToProfile() {
      if (!currentProfile) return;
      if (!myWorkDraft) cloneMyWorkDraftFromProfile();
      const sameWork = Boolean(myWorkDraft.sameWork);
      const currentWeekKey = getCurrentWorkWeekKey();
      currentProfile.same_work_schedule = sameWork;
      serviceDays.forEach((day) => {
        const week1Items = [...getDraftPaddlesForDay(day.key, 'week1')];
        const week2Items = sameWork ? [...week1Items] : [...getDraftPaddlesForDay(day.key, 'week2')];
        currentProfile[weekProfileColumnForServiceDay('week1', day.key)] = week1Items;
        currentProfile[weekProfileColumnForServiceDay('week2', day.key)] = week2Items;
        currentProfile[profileColumnForServiceDay(day.key)] = [...(sameWork || currentWeekKey === 'week1' ? week1Items : week2Items)];
      });
    }

    function buildProfilePayload() {
      const sameWork = isSameWorkSchedule();
      const currentWeekKey = getCurrentWorkWeekKey();
      const payload = {
        user_id: currentUser.id,
        display_name: currentProfile.display_name || null,
        email: currentUserEmail() || null,
        same_work_schedule: sameWork,
      };
      serviceDays.forEach((day) => {
        const week1Items = [...getProfileArray(weekProfileColumnForServiceDay('week1', day.key))];
        const week2Items = sameWork ? [...week1Items] : [...getProfileArray(weekProfileColumnForServiceDay('week2', day.key))];
        payload[weekProfileColumnForServiceDay('week1', day.key)] = week1Items;
        payload[weekProfileColumnForServiceDay('week2', day.key)] = week2Items;
        payload[profileColumnForServiceDay(day.key)] = [...(sameWork || currentWeekKey === 'week1' ? week1Items : week2Items)];
      });
      return payload;
    }

    function buildLegacyProfilePayload() {
      const payload = {
        user_id: currentUser.id,
        display_name: currentProfile.display_name || null,
      };
      serviceDays.forEach((day) => {
        payload[profileColumnForServiceDay(day.key)] = [...getProfileArray(profileColumnForServiceDay(day.key))];
      });
      return payload;
    }

    function isMissingWeeklyColumnError(error) {
      const message = String(error?.message || error?.details || error?.hint || '').toLowerCase();
      return message.includes('same_work_schedule')
        || message.includes('week1_')
        || message.includes('week2_')
        || message.includes('column')
        || message.includes('schema cache');
    }

    function cloneMyWorkDraftFromProfile() {
      const sameWork = isSameWorkSchedule();
      myWorkDraft = {
        sameWork,
        week1: {},
        week2: {},
      };
      serviceDays.forEach((day) => {
        myWorkDraft.week1[day.key] = [...getSavedProfilePaddles(day.key, 'week1')];
        myWorkDraft.week2[day.key] = sameWork
          ? [...myWorkDraft.week1[day.key]]
          : [...getSavedProfilePaddles(day.key, 'week2')];
      });
      return myWorkDraft;
    }

    function getDraftPaddlesForDay(serviceDay, weekKey = getCurrentWorkWeekKey()) {
      if (!myWorkDraft) cloneMyWorkDraftFromProfile();
      const resolvedWeek = myWorkDraft.sameWork ? 'week1' : weekKey;
      return Array.isArray(myWorkDraft?.[resolvedWeek]?.[serviceDay]) ? myWorkDraft[resolvedWeek][serviceDay] : [];
    }

    function setDraftSameWork(enabled) {
      if (!myWorkDraft) cloneMyWorkDraftFromProfile();
      myWorkDraft.sameWork = Boolean(enabled);
      if (myWorkDraft.sameWork) {
        serviceDays.forEach((day) => {
          myWorkDraft.week2[day.key] = [...getDraftPaddlesForDay(day.key, 'week1')];
        });
      }
    }

    function addPaddleToMyWorkDraft(serviceDay, paddleId, weekKey = getCurrentWorkWeekKey()) {
      const normalized = normalizePaddleId(paddleId);
      if (!/^\d+-\d+$/.test(normalized)) {
        return { ok: false, error: 'Enter a valid paddle number like 14 or 1-14.' };
      }
      if (!myWorkDraft) cloneMyWorkDraftFromProfile();
      const targetWeeks = myWorkDraft.sameWork ? ['week1', 'week2'] : [weekKey];
      targetWeeks.forEach((targetWeek) => {
        const items = new Set(getDraftPaddlesForDay(serviceDay, targetWeek));
        items.add(normalized);
        myWorkDraft[targetWeek][serviceDay] = Array.from(items).sort((a, b) => a.localeCompare(b, undefined, { numeric: true }));
      });
      return { ok: true, paddleId: normalized };
    }

    function removePaddleFromMyWorkDraft(serviceDay, paddleId, weekKey = getCurrentWorkWeekKey()) {
      if (!myWorkDraft) cloneMyWorkDraftFromProfile();
      const targetWeeks = myWorkDraft.sameWork ? ['week1', 'week2'] : [weekKey];
      targetWeeks.forEach((targetWeek) => {
        myWorkDraft[targetWeek][serviceDay] = getDraftPaddlesForDay(serviceDay, targetWeek).filter((item) => item !== paddleId);
      });
    }

    function isSavedToMyWork(paddleId, serviceDay) {
      return getSavedProfilePaddles(serviceDay).includes(paddleId);
    }

    async function requestTripNotificationPermission() {
      if (!('Notification' in window) || !window.isSecureContext) return false;
      if (Notification.permission === 'granted') return true;
      if (Notification.permission === 'denied') return false;
      const permission = await Notification.requestPermission();
      return permission === 'granted';
    }

    async function showTripStartNotification(title, options = {}) {
      if (!('Notification' in window) || Notification.permission !== 'granted') return false;
      const payload = {
        body: options.body || '',
        tag: options.tag || 'ero-trip-start',
        renotify: true,
        requireInteraction: false,
        data: { url: window.location.href },
      };
      if ('serviceWorker' in navigator) {
        try {
          const registration = await Promise.race([
            navigator.serviceWorker.ready,
            new Promise((_, reject) => window.setTimeout(() => reject(new Error('Service worker not ready')), 1500)),
          ]);
          await registration.showNotification(title, payload);
          return true;
        } catch (_) {
          // Fall back to a page notification below.
        }
      }
      new Notification(title, payload);
      return true;
    }

      const trip = live.nextSequence || live.sequence || '';

      return {

        station,
        block: live.nextBlock || live.block || '',

    function withRequestTimeout(request, label = 'Request', timeoutMs = 15000) {
      return new Promise((resolve, reject) => {
        const timer = window.setTimeout(() => {
          reject(new Error(`${label} timed out. Check the connection and try again.`));
        }, timeoutMs);
        Promise.resolve(request)
          .then((value) => {
            window.clearTimeout(timer);
            resolve(value);
          })
          .catch((error) => {
            window.clearTimeout(timer);
            reject(error);
          });
      });
    }

    function withLrvRequestTimeout(request, label = 'LRV request', timeoutMs = 15000) {
      return withRequestTimeout(request, label, timeoutMs);
    }

    function dateTimeLocalToIso(value) {
      const raw = String(value || '').trim();
      if (!raw) return null;
      const date = new Date(raw);
      return Number.isNaN(date.getTime()) ? null : date.toISOString();

    function formatOptionalReportDate(value) {

    function getTodayDateValue() {
      const parts = new Intl.DateTimeFormat('en-CA', {
        timeZone,
        year: 'numeric',
        month: '2-digit',
        day: '2-digit',
      }).formatToParts(new Date());
      const lookup = Object.fromEntries(parts.map((part) => [part.type, part.value]));
      return `${lookup.year}-${lookup.month}-${lookup.day}`;
    }

    function getCurrentMonthStartValue() {
      const parts = new Intl.DateTimeFormat('en-CA', {
        timeZone,
        year: 'numeric',
        month: '2-digit',
      }).formatToParts(new Date());
      const lookup = Object.fromEntries(parts.map((part) => [part.type, part.value]));
      return `${lookup.year}-${lookup.month}-01`;
    }

    function parseExportDateValue(value) {
      const match = String(value || '').match(/^(\d{4})-(\d{2})-(\d{2})$/);
      if (!match) return null;
      const year = Number(match[1]);
      const monthIndex = Number(match[2]) - 1;
      const day = Number(match[3]);
      const date = new Date(year, monthIndex, day);
      if (Number.isNaN(date.getTime())) return null;
      return date;
    }

    function dateRangeToIso(fromValue, toValue) {
      const fromDate = parseExportDateValue(fromValue);
      const toDate = parseExportDateValue(toValue);
      if (!fromDate && !toDate) return null;
      const start = fromDate && toDate && fromDate > toDate ? toDate : fromDate;
      const endBase = fromDate && toDate && fromDate > toDate ? fromDate : toDate;
      const range = {};
      if (start) range.start = start.toISOString();
      if (endBase) {
        const end = new Date(endBase);
        end.setDate(end.getDate() + 1);
        range.end = end.toISOString();
      }
      return range;
    }

    function formatExportDateLabel(value) {
      const date = parseExportDateValue(value);
      if (!date) return '';
      return new Intl.DateTimeFormat('en-CA', {
        timeZone,
        month: 'short',
        day: 'numeric',
        year: 'numeric',
      }).format(date);
    }

    function formatExportPeriodLabel(fromValue, toValue) {
      const fromLabel = formatExportDateLabel(fromValue);
      const toLabel = formatExportDateLabel(toValue);
      if (!fromLabel && !toLabel) return 'All dates';
      if (fromLabel && toLabel) return `${fromLabel} to ${toLabel}`;
      if (fromLabel) return `From ${fromLabel}`;
      return `Through ${toLabel}`;
    }

    function normalizeExportDateInputs() {
      const range = dateRangeToIso(lrvExportFromDate, lrvExportToDate);
      if (!range?.start || !range?.end) return;
      const fromDate = parseExportDateValue(lrvExportFromDate);
      const toDate = parseExportDateValue(lrvExportToDate);
      if (fromDate && toDate && fromDate > toDate) {
        const previousFrom = lrvExportFromDate;
        lrvExportFromDate = lrvExportToDate;
        lrvExportToDate = previousFrom;
      }
    }

    function renderLrvReportMeta(report) {
      const rows = [
        `Category: ${formatLrvDefectCategory(report.defect_category || 'other')}`,
      ];

      rows.push(`Status: ${formatLrvReportStatus(report.report_status)}`);
      rows.push(`Mainline: ${formatOptionalReportDate(report.mlc_reported_at)}`);
      return rows.join(' | ');

    async function loadLrvDefectAccessState(force = false) {
      if (!supabaseClient || !currentUser) {
        lrvDefectAccessAllowed = false;
        lrvDefectAccessRole = '';
        lrvDefectAccessLoaded = true;
        lrvDefectAccessList = [];
        lrvDefectAccessPendingRoles.clear();
        lrvDefectProfileList = [];
        lrvDefectSchemaWarning = '';
        updateAccountButton();
        return false;
      }
      if (lrvDefectAccessLoaded && !force) return lrvDefectAccessAllowed;
      if (currentUserEmail() === lrvDefectAdminEmail) {
        lrvDefectAccessAllowed = true;
        lrvDefectAccessRole = 'admin';
        lrvDefectAccessLoaded = true;
        await loadLrvDefectAccessList();
        updateAccountButton();
        return true;
      }
      const { data, error } = await withLrvRequestTimeout(supabaseClient
        .from('ero_lrv_defect_access')
        .select('email, role')
        .eq('email', currentUserEmail())
        .maybeSingle(), 'LRV access lookup');
      if (error && setLrvSchemaWarning(error)) {
        lrvDefectAccessRole = '';
        lrvDefectAccessAllowed = false;
        lrvDefectAccessLoaded = true;
        updateAccountButton();
        return false;
      }
      lrvDefectAccessRole = data && !error ? normalizeLrvAccessRole(data.role) : '';
      lrvDefectAccessAllowed = Boolean(lrvDefectAccessRole);
      lrvDefectAccessLoaded = true;
      if (isLrvDefectAdmin()) await loadLrvDefectAccessList();
      updateAccountButton();
      return lrvDefectAccessAllowed;
    }

    async function loadLrvDefectAccessList() {
      if (!supabaseClient || !isLrvDefectAdmin()) {
        lrvDefectAccessList = [];
        return [];
      }
      const { data, error } = await withLrvRequestTimeout(supabaseClient
        .from('ero_lrv_defect_access')
        .select('email, role, created_at')
        .order('email', { ascending: true }), 'LRV access list');
      if (error) {
        setLrvSchemaWarning(error);
        lrvDefectAccessList = [];
        return [];
      }
      lrvDefectAccessList = Array.isArray(data) ? data : [];
      mergePendingLrvDefectAccessRoles();
      await loadLrvDefectProfileList();
      return lrvDefectAccessList;
    }

    function upsertLocalLrvDefectAccess(email, role) {
      const normalizedEmail = normalizeEmail(email);
      const normalizedRole = normalizeLrvAccessRole(role);
      if (!normalizedEmail) return;
      const existingIndex = lrvDefectAccessList.findIndex((item) => normalizeEmail(item.email) === normalizedEmail);
      const existing = existingIndex >= 0 ? lrvDefectAccessList[existingIndex] : {};
      const nextEntry = {
        ...existing,
        email: normalizedEmail,
        role: normalizedRole,
        created_at: existing.created_at || new Date().toISOString(),
      };
      if (existingIndex >= 0) {
        lrvDefectAccessList[existingIndex] = nextEntry;
      } else {
        lrvDefectAccessList.push(nextEntry);
      }
      lrvDefectAccessList.sort((a, b) => normalizeEmail(a.email).localeCompare(normalizeEmail(b.email)));
    }

    function mergePendingLrvDefectAccessRoles() {
      if (!lrvDefectAccessPendingRoles.size) return;
      lrvDefectAccessPendingRoles.forEach((role, email) => {
        const normalizedRole = normalizeLrvAccessRole(role);
        const loadedEntry = lrvDefectAccessList.find((item) => normalizeEmail(item.email) === email);
        if (loadedEntry && normalizeLrvAccessRole(loadedEntry.role) === normalizedRole) {
          lrvDefectAccessPendingRoles.delete(email);
          return;
        }
        upsertLocalLrvDefectAccess(email, normalizedRole);
      });
    }

    function syncCurrentLrvDefectAccess(email, role) {
      if (normalizeEmail(email) !== currentUserEmail()) return;
      lrvDefectAccessRole = normalizeLrvAccessRole(role);
      lrvDefectAccessAllowed = Boolean(lrvDefectAccessRole);
      lrvDefectAccessLoaded = true;
      updateAccountButton();
    }

    function refreshLrvDefectAdminPanel() {
      const adminPanel = document.getElementById('lrvDefectAdminPanel');
      if (adminPanel) adminPanel.outerHTML = renderLrvDefectAdminPanel();
    }

    async function refreshLrvDefectAccessAfterMutation(email, role) {
      const normalizedEmail = normalizeEmail(email);
      const normalizedRole = normalizeLrvAccessRole(role);
      if (normalizedEmail) {
        lrvDefectAccessPendingRoles.set(normalizedEmail, normalizedRole);
        upsertLocalLrvDefectAccess(normalizedEmail, normalizedRole);
        syncCurrentLrvDefectAccess(normalizedEmail, normalizedRole);
      }
      refreshLrvDefectAdminPanel();
      try {
        await loadLrvDefectAccessList();
        refreshLrvDefectAdminPanel();
        if (!lrvDefectsView.hidden) await renderLrvDefectsPage();
      } catch (error) {
        refreshLrvDefectAdminPanel();
        showToast('Access saved', 'The list will finish refreshing the next time this page loads.');
      }
    }

    async function loadLrvDefectProfileList() {
      if (!supabaseClient || !isLrvDefectAdmin()) {
        lrvDefectProfileList = [];
        return [];
      }
      const { data, error } = await withLrvRequestTimeout(supabaseClient
        .from('ero_user_profiles')
        .select('display_name, email')
        .not('email', 'is', null)
        .order('email', { ascending: true }), 'LRV account list');
      if (error) {
        setLrvSchemaWarning(error);
        lrvDefectProfileList = [];
        return [];
      }
      const seen = new Set();
      lrvDefectProfileList = (Array.isArray(data) ? data : [])
        .map((profile) => ({
          email: normalizeEmail(profile.email),
          displayName: profile.display_name || '',
        }))
        .filter((profile) => {
          if (!profile.email || seen.has(profile.email)) return false;
          seen.add(profile.email);
          return true;
        });
      return lrvDefectProfileList;
    }

    function getLrvAccessStatus(email) {
      const normalizedEmail = normalizeEmail(email);
      const profile = lrvDefectProfileList.find((item) => item.email === normalizedEmail);
      return profile
        ? { label: 'Active', className: 'ok', detail: profile.displayName || normalizedEmail }
        : { label: 'Pending', className: 'warn', detail: 'No account has signed in with this email yet.' };
    }

    function buildLrvDefectExportQuery(scope = 'current') {
      let query = supabaseClient
        .from('ero_lrv_defect_reports')
        .select('id, lrv_number, cab, defect_category, seat_issue_detail, thermo_king_mode, mlc_reported_at, report_status, defect_text, reported_by_email, reported_at')
        .order('lrv_number', { ascending: true })
        .order('reported_at', { ascending: false });
      if (scope !== 'all') query = query.eq('lrv_number', selectedLrvNumber);
      const dateRange = dateRangeToIso(lrvExportFromDate, lrvExportToDate);
      if (dateRange?.start) query = query.gte('reported_at', dateRange.start);
      if (dateRange?.end) query = query.lt('reported_at', dateRange.end);
      return query;
    }

    async function fetchLrvDefectReportsForExport(scope = 'current') {
      if (!supabaseClient || !isLrvDefectAdmin()) return [];
      normalizeExportDateInputs();
      const allReports = [];
      const pageSize = 500;
      let offset = 0;
      while (true) {
        const query = buildLrvDefectExportQuery(scope).range(offset, offset + pageSize - 1);
        const { data, error } = await withLrvRequestTimeout(query, 'LRV export reports', 60000);
        if (error) throw error;
        const reports = Array.isArray(data) ? data : [];
        allReports.push(...reports);
        if (reports.length < pageSize) break;
        offset += pageSize;
      }
      return allReports;
    }

        <html>
        <head>
          <meta charset="utf-8">
          <title>${escapeHtml(title)}</title>
          <style>
            @page { margin: 0.6in; }
            body { font-family: Arial, sans-serif; color: #111; line-height: 1.35; }
            h1 { margin: 0; font-size: 24px; }
            h2 { margin: 24px 0 10px; font-size: 18px; border-bottom: 1px solid #bbb; padding-bottom: 5px; }
            .meta { color: #555; margin: 6px 0 20px; font-size: 12px; }
            .report { border: 1px solid #ccc; border-radius: 6px; padding: 10px 12px; margin: 0 0 10px; break-inside: avoid; }
            .report-head { display: flex; justify-content: space-between; gap: 16px; font-size: 14px; }
            .report-meta { color: #555; font-size: 12px; margin-top: 4px; }
            p { white-space: pre-wrap; margin: 10px 0 0; }
            @media print { .print-actions { display: none; } }
            .print-actions { align-items: center; display: flex; flex-wrap: wrap; gap: 8px; margin: 0 0 18px; }
            button { border: 1px solid #111; border-radius: 4px; padding: 9px 13px; font: inherit; background: #fff; }
            .primary { background: #111; color: #fff; }
            .hint { color: #555; font-size: 12px; width: 100%; }
          </style>
        </head>
        <body>
          <div class="print-actions">

            <span class="hint">After printing, use Back to LRV Defects or close this report tab/window.</span>
          </div>
          <h1>${escapeHtml(title)}</h1>
          <div class="meta">Generated ${escapeHtml(generatedAt)} · ${escapeHtml(periodLabel)} · ${escapeHtml(reports.length)} report${reports.length === 1 ? '' : 's'}</div>

          <script>
            function returnToLrvDefects() {
              if (window.opener && !window.opener.closed) {

                return;

    async function exportLrvDefectReports(scope = 'current') {
      if (!isLrvDefectAdmin()) return;
      const exportWindow = window.open('', '_blank');
      if (!exportWindow) {
        showToast('Export blocked', 'Allow pop-ups, then try the export again.');
        setStatus('Export blocked', false);
        return;
      }
      exportWindow.document.open();
      exportWindow.document.write('<!doctype html><title>Preparing PDF</title><body style="font-family:Arial,sans-serif;padding:24px;">Preparing report...</body>');
      exportWindow.document.close();
      try {
        setStatus('Preparing PDF...', true);
        const reports = await fetchLrvDefectReportsForExport(scope);
        exportWindow.document.open();
        exportWindow.document.write(buildLrvDefectExportHtml(reports, scope));
        exportWindow.document.close();
        setStatus('PDF export ready', true);
      } catch (error) {
        setLrvSchemaWarning(error);
        exportWindow.document.open();
        exportWindow.document.write(`<!doctype html><title>Export failed</title><body style="font-family:Arial,sans-serif;padding:24px;"><h1>Export failed</h1><p>${escapeHtml(lrvDefectSchemaWarning || error.message || 'Could not export reports.')}</p></body>`);
        exportWindow.document.close();
        setStatus('Export failed', false);
        showToast('Export failed', lrvDefectSchemaWarning || error.message || 'Could not export reports.');
      }
    }

    function datetimeLocalValue(value) {
      if (!value) return '';
      const date = new Date(value);
      if (Number.isNaN(date.getTime())) return '';
      const pad = (number) => String(number).padStart(2, '0');
      return `${date.getFullYear()}-${pad(date.getMonth() + 1)}-${pad(date.getDate())}T${pad(date.getHours())}:${pad(date.getMinutes())}`;
    }

    function openAccountModal() {
      renderAccountModal();
      accountOverlay.hidden = false;

    async function fetchSupabaseConfig() {
      try {
        const response = await fetch('/api/supabase-config');
        const data = await response.json();
        if (!response.ok || !data.ok || !data.enabled) return null;
        return data;
      } catch (_) {
        return null;
      }
    }

    async function fetchAccountOptions() {
      if (accountOptions) return accountOptions;
      try {
        const response = await fetch('/api/account-options');
        const data = await response.json();
        if (!response.ok || !data.ok) return null;
        accountOptions = data.paddleOptions || null;
        return accountOptions;
      } catch (_) {
        return null;
      }
    }

    async function ensureProfileRow() {
      if (!supabaseClient || !currentUser) return false;
      if (currentProfile) return true;
      const fallbackName = currentUser.user_metadata?.display_name || currentUser.user_metadata?.username || '';
      const { data, error } = await withRequestTimeout(supabaseClient
        .from('ero_user_profiles')
        .upsert({
          user_id: currentUser.id,
          display_name: fallbackName || null,
          email: currentUserEmail() || null,
        }, { onConflict: 'user_id' })
        .select('*')
        .single(), 'Account profile', 15000);
      if (error || !data) {
        currentProfile = null;
        setAccountNotice(error?.message || 'Could not load your saved work.', 'warn');
        return false;
      }
      currentProfile = data;
      return true;
    }

    async function loadProfile() {
      if (!supabaseClient || !currentUser) {
        currentProfile = null;
        myWorkDraft = null;
        updateAccountButton();
        return;
      }
      const { data, error } = await withRequestTimeout(supabaseClient
        .from('ero_user_profiles')
        .select('*')
        .eq('user_id', currentUser.id)
        .maybeSingle(), 'Account profile', 15000);
      if (error) {
        currentProfile = null;
      } else if (data) {
        currentProfile = data;
        if (currentUserEmail() && currentProfile.email !== currentUserEmail()) {
          currentProfile.email = currentUserEmail();
          await withRequestTimeout(saveCurrentProfile(), 'Account profile update', 15000);
        }
      } else {
        currentProfile = null;
        await ensureProfileRow();
      }
      myWorkDraft = null;
      syncTodaysPaddleFromMyWork();
      updateAccountButton();
    }

    async function saveCurrentProfile() {
      if (!supabaseClient || !currentUser || !currentProfile) return { ok: false, error: 'Not signed in.' };
      const payload = buildProfilePayload();
      let usedLegacyFallback = false;
      let { data, error } = await supabaseClient
        .from('ero_user_profiles')
        .upsert(payload, { onConflict: 'user_id' })
        .select('*')
        .single();
      if (error && isMissingWeeklyColumnError(error)) {
        const fallback = await supabaseClient
          .from('ero_user_profiles')
          .upsert(buildLegacyProfilePayload(), { onConflict: 'user_id' })
          .select('*')
          .single();
        data = fallback.data;
        error = fallback.error;
        if (!error) {
          usedLegacyFallback = true;
          setAccountNotice('Saved using the current database columns. Apply the Week 1 / Week 2 migration to save separate weeks.', 'warn');
        }
      }
      if (error) return { ok: false, error: error.message || 'Could not save profile.' };
      currentProfile = data;
      myWorkDraft = null;
      return { ok: true, usedLegacyFallback };
    }

    async function saveMyWorkDraft() {
      if (!currentUser) return { ok: false, error: 'Sign in first to save your work.' };
      const ready = await ensureProfileRow();
      if (!ready || !currentProfile) return { ok: false, error: accountNotice.text || 'Could not load your saved work.' };
      if (!myWorkDraft) cloneMyWorkDraftFromProfile();
      applyMyWorkDraftToProfile();
      const result = await saveCurrentProfile();
      if (result.ok) syncTodaysPaddleFromMyWork();
      return result;
    }

    async function persistMyWorkDraft(actionLabel = 'My Work saved') {
      const result = await saveMyWorkDraft();
      if (!result.ok) {
        setStatus(result.error || 'Could not save work.', false);
        showToast('Save failed', result.error || 'Your work was not saved. Please try again.');
        return false;
      }
      if (!todaysPaddleView.hidden) await renderTodaysPaddlePage();
      setStatus(actionLabel, true);
      return true;
    }

    async function savePaddleToMyWork(paddleId, serviceDay) {
      if (!currentUser) {
        setAccountNotice('Sign in first to save paddles to My Work.', 'warn');
        openAccountModal();
        return false;
      }
      const ready = await ensureProfileRow();
      if (!ready || !currentProfile) {
        setStatus('Save failed', false);
        return false;
      }
      const sameWork = isSameWorkSchedule();
      const targetWeeks = sameWork ? ['week1', 'week2'] : [getCurrentWorkWeekKey()];
      targetWeeks.forEach((weekKey) => {
        const key = weekProfileColumnForServiceDay(weekKey, serviceDay);
        currentProfile[key] = [...new Set([...getProfileArray(key), paddleId])].sort((a, b) => a.localeCompare(b, undefined, { numeric: true }));
      });
      currentProfile.same_work_schedule = sameWork;
      currentProfile[profileColumnForServiceDay(serviceDay)] = [...getSavedProfilePaddles(serviceDay)];
      const result = await saveCurrentProfile();
      if (!result.ok) {
        setStatus('Save failed', false);
        setAccountNotice(result.error, 'warn');
        showToast('Save failed', result.error || 'Your work was not saved. Please try again.');
        return false;
      }
      syncTodaysPaddleFromMyWork();
      if (!todaysPaddleView.hidden) {
        await renderTodaysPaddlePage();
      }
      setStatus('Saved to My Work', true);
      showToast('Saved to My Work', result.usedLegacyFallback
        ? `${paddleId} was saved. Week 1 / Week 2 split needs the database migration.`
        : `${paddleId} is saved for ${formatServiceLabel(serviceDay)} ${sameWork ? 'both weeks' : `Week ${getWeekNumber()}`}.`);
      return true;
    }

    async function removePaddleFromMyWork(paddleId, serviceDay) {
      if (!currentUser || !currentProfile) return false;
      const sameWork = isSameWorkSchedule();
      const targetWeeks = sameWork ? ['week1', 'week2'] : [getCurrentWorkWeekKey()];
      targetWeeks.forEach((weekKey) => {
        const key = weekProfileColumnForServiceDay(weekKey, serviceDay);
        currentProfile[key] = getProfileArray(key).filter((item) => item !== paddleId);
      });
      currentProfile[profileColumnForServiceDay(serviceDay)] = getSavedProfilePaddles(serviceDay).filter((item) => item !== paddleId);
      const result = await saveCurrentProfile();
      if (!result.ok) {
        setStatus('Remove failed', false);
        return false;
      }
      syncTodaysPaddleFromMyWork();
      if (!todaysPaddleView.hidden) {
        await renderTodaysPaddlePage();
      }
      setStatus('Removed from My Work', true);
      return true;
    }

    async function signInWithPassword() {
      clearAccountFieldErrors();
      const email = document.getElementById('authEmail')?.value?.trim() || '';
      const password = document.getElementById('authPassword')?.value || '';
      if (!email || !password) {
        if (!email) markAccountFieldError('authEmail');
        if (!password) markAccountFieldError('authPassword');
        setAccountNotice('Enter your email and password first.', 'warn');
        renderAccountModal();
        return;
      }
      const signInBtn = document.getElementById('signInBtn');
      if (signInBtn) {
        signInBtn.disabled = true;
        signInBtn.textContent = 'Signing In...';
      }
      try {
        const { data, error } = await withRequestTimeout(
          supabaseClient.auth.signInWithPassword({ email, password }),
          'Sign in',
          15000
        );
        if (error) throw error;
        const session = data?.session || (await withRequestTimeout(
          supabaseClient.auth.getSession(),
          'Account session',
          8000
        ))?.data?.session;
        if (!session?.user) throw new Error('Sign in did not return an account session. Try again.');
        currentUser = session.user;
        updateAccountButton();
        setAccountNotice('', '');
        setStatus('Account signed in', true);
        showToast('Signed in', currentUser.email || email);
        closeAccountModal();
        handleSession(session)
          .then(() => setStatus('Account ready', true))
          .catch((error) => {
            setStatus('Account data delayed', false);
            setAccountNotice(error?.message || 'Signed in, but account data did not finish loading. Try Retry or reload.', 'warn');
          });
      } catch (error) {
        markAccountFieldError('authEmail');
        markAccountFieldError('authPassword');
        setAccountNotice(error?.message || 'Sign in failed.', 'warn');
        setStatus('Sign in failed', false);
        showToast('Sign in failed', error?.message || 'Check your email and password, then try again.');
        renderAccountModal();
      } finally {
        const refreshedSignInBtn = document.getElementById('signInBtn');
        if (refreshedSignInBtn) {
          refreshedSignInBtn.disabled = false;
          refreshedSignInBtn.textContent = 'Sign In';
        }
      }
    }

    async function signUpWithPassword() {
      clearAccountFieldErrors();
      const displayName = document.getElementById('authDisplayName')?.value?.trim() || '';
      const email = document.getElementById('authEmail')?.value?.trim() || '';
      const password = document.getElementById('authPassword')?.value || '';
      const passwordConfirm = document.getElementById('authPasswordConfirm')?.value || '';
      if (!displayName || !email || !password || !passwordConfirm) {
        if (!displayName) markAccountFieldError('authDisplayName');
        if (!email) markAccountFieldError('authEmail');
        if (!password) markAccountFieldError('authPassword');
        if (!passwordConfirm) markAccountFieldError('authPasswordConfirm');
        setAccountNotice('Enter your name, email, and both password fields.', 'warn');
        renderAccountModal();
        return;
      }
      if (password !== passwordConfirm) {
        markAccountFieldError('authPassword');
        markAccountFieldError('authPasswordConfirm');
        setAccountNotice('Passwords do not match.', 'warn');
        renderAccountModal();
        return;
      }
      const { data, error } = await supabaseClient.auth.signUp({
        email,
        password,
        options: {
          data: {
            display_name: displayName,
            username: displayName,
          },
        },
      });
      if (error) {
        setAccountNotice(error.message || 'Could not create the account.', 'warn');
        renderAccountModal();
        return;
      }
      if (data?.user?.id) {
        currentProfile = {
          user_id: data.user.id,
          display_name: displayName,
          email: String(email || '').trim().toLowerCase(),
          same_work_schedule: true,
          mon_thu_paddles: [],
          friday_paddles: [],
          saturday_paddles: [],
          sunday_paddles: [],
          week1_mon_thu_paddles: [],
          week1_friday_paddles: [],
          week1_saturday_paddles: [],
          week1_sunday_paddles: [],
          week2_mon_thu_paddles: [],
          week2_friday_paddles: [],
          week2_saturday_paddles: [],
          week2_sunday_paddles: [],
        };
        await saveCurrentProfile();
      }
      accountAuthMode = 'signin';
      setAccountNotice('Account created. You can sign in now.', 'ok');
      renderAccountModal();
    }

    async function setNewPassword() {
      clearAccountFieldErrors();
      const password = document.getElementById('recoveryPassword')?.value || '';
      const confirm = document.getElementById('recoveryPasswordConfirm')?.value || '';
      if (!password || !confirm) {
        if (!password) markAccountFieldError('recoveryPassword');
        if (!confirm) markAccountFieldError('recoveryPasswordConfirm');
        setAccountNotice('Enter your new password in both fields.', 'warn');
        renderAccountModal();
        return;
      }
      if (password !== confirm) {
        markAccountFieldError('recoveryPassword');
        markAccountFieldError('recoveryPasswordConfirm');
        setAccountNotice('Passwords do not match.', 'warn');
        renderAccountModal();
        return;
      }
      const { error } = await supabaseClient.auth.updateUser({ password });
      if (error) {
        setAccountNotice(error.message || 'Could not update password.', 'warn');
        renderAccountModal();
        return;

      accountRecoveryMode = false;
      setAccountNotice('Password updated.', 'ok');
      closeAccountModal();

    async function saveSettings() {
      if (!currentUser) return;
      const ready = await ensureProfileRow();
      if (!ready || !currentProfile) {
        renderAccountModal();
        return;
      }
      const displayName = document.getElementById('profileDisplayName')?.value?.trim() || '';
      currentProfile.display_name = displayName || null;
      const result = await saveCurrentProfile();
      if (!result.ok) {
        setAccountNotice(result.error, 'warn');
        renderAccountModal();
        return;
      }
      await supabaseClient.auth.updateUser({
        data: {
          display_name: displayName,
          username: displayName,
        },
      });
      setAccountNotice('Settings saved.', 'ok');
      renderAccountModal();
    }

    async function updateTripNotificationSettings() {
      const enabledInput = document.getElementById('tripNotificationEnabled');
      const leadInput = document.getElementById('tripNotificationLead');
      const wantsEnabled = Boolean(enabledInput?.checked);
      const leadMinutes = [3, 5].includes(Number(leadInput?.value)) ? Number(leadInput.value) : 5;
      tripNotificationSettings.leadMinutes = leadMinutes;
      if (wantsEnabled) {
        const allowed = await requestTripNotificationPermission();
        tripNotificationSettings.enabled = allowed;
        setAccountNotice(allowed
          ? `Trip notifications are on for ${leadMinutes} minutes before start.`
          : notificationSupportMessage(), allowed ? 'ok' : 'warn');
      } else {
        tripNotificationSettings.enabled = false;
        setAccountNotice('Trip notifications are off.', 'ok');
      }
      saveTripNotificationSettings();
      renderAccountModal();
      refreshCountdowns();
    }

      if (!supabaseClient) return;
      try {

    async function handleSession(session) {
      currentUser = session?.user || null;
      if (!currentUser) {
        currentProfile = null;
        lrvDefectAccessAllowed = false;
        lrvDefectAccessRole = '';
        lrvDefectAccessLoaded = true;
        lrvDefectAccessList = [];
        lrvDefectAccessPendingRoles.clear();
        lrvDefectProfileList = [];
      } else {
        await loadProfile();
        lrvDefectAccessLoaded = false;
        await loadLrvDefectAccessState(true);
      }
      updateAccountButton();
      if (!accountOverlay.hidden) {
        renderAccountModal();
      }
      if (!myWorkView.hidden) {
        await renderMyWorkPage();
      }
      if (!lrvDefectsView.hidden) {
        await renderLrvDefectsPage();
      }
    }

    async function initSupabase() {
      const config = await fetchSupabaseConfig();
      supabaseEnabled = Boolean(config && window.supabase && typeof window.supabase.createClient === 'function');
      updateAccountButton();
      if (!supabaseEnabled) {
        await maybeOpenTodaysPaddleOnBoot();
        return;
      }
      supabaseClient = window.supabase.createClient(config.url, config.anonKey);
      accountRecoveryMode = isRecoveryUrl();
      const sessionResult = await withRequestTimeout(supabaseClient.auth.getSession(), 'Account session', 8000)
        .catch(() => ({ data: { session: null } }));
      const bootSession = sessionResult?.data?.session || null;
      if (bootSession?.user) {
        currentUser = bootSession.user;
        updateAccountButton();
        handleSession(bootSession).catch((error) => {
          setStatus('Account data delayed', false);
          setAccountNotice(error?.message || 'Account data did not finish loading. Try again.', 'warn');
        });
      } else {
        await handleSession(null);
      }
      if (accountRecoveryMode) openAccountModal();
      supabaseClient.auth.onAuthStateChange((event, session) => {
        if (event === 'PASSWORD_RECOVERY') {
          accountRecoveryMode = true;
          openAccountModal();
        }
        handleSession(session).catch((error) => {
          setStatus('Account data delayed', false);
          setAccountNotice(error?.message || 'Account data did not finish loading. Try again.', 'warn');
        });
      });
      await maybeOpenTodaysPaddleOnBoot();
    }

    function timeToSecondsClock(value) {
      const match = String(value || '').trim().match(/^(\d{1,2}):(\d{2})$/);
      if (!match) return null;
      return (Number(match[1]) * 3600) + (Number(match[2]) * 60);
    }

    function getOttawaNowSeconds() {
      const parts = new Intl.DateTimeFormat('en-CA', {
        timeZone,
        hour: '2-digit',
        minute: '2-digit',
        second: '2-digit',
        hour12: false,
      }).formatToParts(new Date());
      const lookup = Object.fromEntries(parts.map((part) => [part.type, part.value]));
      return (Number(lookup.hour || 0) * 3600) + (Number(lookup.minute || 0) * 60) + Number(lookup.second || 0);
    }

    function formatCountdown(totalSeconds) {
      const safe = Math.max(0, totalSeconds);
      const hours = Math.floor(safe / 3600);
      const minutes = Math.floor((safe % 3600) / 60);
      const seconds = safe % 60;
      if (hours > 0) return `${hours}:${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
      return `${minutes}:${String(seconds).padStart(2, '0')}`;
    }

    function formatDurationMinutes(totalMinutes) {
      const safe = Math.max(0, Number(totalMinutes) || 0);
      const hours = Math.floor(safe / 60);
      const minutes = safe % 60;
      if (hours && minutes) return `${hours} hr ${minutes} min`;
      if (hours) return `${hours} hr`;
      return `${minutes} min`;
    }

    function renderCountdown(live, prefixOverride = null) {
      if (!live || !live.targetTime || !['trip', 'break', 'prestart', 'clearing'].includes(live.kind)) return '';
      const prefix = prefixOverride || (live.kind === 'trip' ? 'Done in' : live.kind === 'clearing' ? 'Clear in' : 'Next trip in');
      return `<div class="muted" data-countdown="${escapeHtml(prefix)}" data-target-time="${escapeHtml(live.targetTime)}" data-countdown-kind="${escapeHtml(live.kind)}">${escapeHtml(prefix)} calculating...</div>`;
    }

    function getNextAction(live) {
      if (!live) {
        return { title: 'Enter a paddle to see what is coming up.', detail: '', countdownPrefix: '' };
      }
      if (live.kind === 'trip') {
        const tripName = live.sequence && live.directionLabel ? `Trip ${live.sequence} - ${live.directionLabel}` : `Trip ${live.sequence || ''}`.trim();
        return {
          title: tripName,
          detail: live.block ? `Block ${live.block}` : '',
          countdownPrefix: 'Done in',
        };
      }
      if (live.kind === 'prestart') {
        const startsAtTunneys = String(live.nextStartStop || '').toLowerCase().includes('tunney');
        if (live.phase === 'report') {
          if (startsAtTunneys) {
            return {
              title: `Head to Bayview to grab a radio${live.reportTime ? ` by ${live.reportTime}` : ''}`,
              detail: live.sequence ? `Trip ${live.sequence} at ${live.nextStartTime || live.targetTime || ''}`.trim() : '',
              countdownPrefix: 'Report in',
            };
          }
          const place = live.reportPlaceName || live.nextStartStop || 'report point';
          const time = live.reportTime || live.targetTime || '';
          return {
            title: `Report at ${place}${time ? ` at ${time}` : ''}`,
            detail: live.sequence && live.directionLabel ? `Trip ${live.sequence} - ${live.directionLabel}` : '',
            countdownPrefix: 'Report in',
          };
        }
        if (startsAtTunneys) {
          return {
            title: `Make your way to Tunney's for Trip ${live.sequence || ''}${live.nextStartTime ? ` at ${live.nextStartTime}` : ''}`.trim(),
            detail: live.block ? `Block ${live.block}` : '',
            countdownPrefix: 'Depart in',
          };
        }
        const place = live.nextStartStop || 'start point';
        const time = live.nextStartTime || live.targetTime || '';
        return {
          title: `Depart ${place}${time ? ` at ${time}` : ''}`,
          detail: live.nextEndStop ? `Toward ${live.nextEndStop}${live.block ? ` | Block ${live.block}` : ''}` : '',
          countdownPrefix: 'Depart in',
        };
      }
      if (live.kind === 'break') {
        const time = live.nextStartTime || live.targetTime || '';
        if (live.splitBreak) {
          const secondPieceStartsAtTunneys = String(live.nextStartStop || '').toLowerCase().includes('tunney');
          if (secondPieceStartsAtTunneys) {
            return {
              title: `Head to Bayview to grab a radio${time ? ` by ${time}` : ''}`,
              detail: `Second piece${live.nextSequence ? ` Trip ${live.nextSequence}` : ''} starts at Tunney's${live.nextTripStartTime ? ` at ${live.nextTripStartTime}` : ''}`,
              countdownPrefix: 'Back in',
            };
          }
          return {
            title: `Split ends${time ? ` at ${time}` : ''}`,
            detail: live.nextStartStop ? `Back at ${live.nextStartStop}` : '',
            countdownPrefix: 'Back in',
          };
        }
        return {
          title: `Break until Trip ${live.nextSequence || ''}${time ? ` at ${time}` : ''}`.trim(),
          detail: live.nextStartStop ? `Next start: ${live.nextStartStop}` : '',
          countdownPrefix: 'Remaining',
        };
      }
      if (live.kind === 'clearing') {
        if (live.label && live.label.startsWith('Going on split')) {
          return {
            title: live.label,
            detail: live.block ? `Block ${live.block}` : '',
            countdownPrefix: 'Split in',
          };
        }
        if (live.finalClear) {
          return {
            title: `Return and sign out radio${live.targetTime ? ` by ${live.targetTime}` : ''}`,
            detail: live.directionLabel ? `After ${live.directionLabel}` : '',
            countdownPrefix: 'Clear in',
          };
        }
        return {
          title: `Clear block ${live.block || ''}${live.targetTime ? ` at ${live.targetTime}` : ''}`.trim(),
          detail: live.directionLabel ? `After ${live.directionLabel}` : '',
          countdownPrefix: 'Clear in',
        };
      }
      if (live.kind === 'complete') {
        return { title: live.label || 'Done for today.', detail: '', countdownPrefix: '' };
      }
      return { title: live.label || 'Paddle loaded.', detail: '', countdownPrefix: '' };
    }

    async function refreshPaddleCard(card) {

      const paddleId = card.dataset.paddleCard;
      const serviceDay = card.dataset.serviceDay || '';
      if (!paddleId) return;
      card.dataset.refreshing = 'true';
      try {
        const params = new URLSearchParams({ id: paddleId });
        if (serviceDay) params.set('day', serviceDay);
        const response = await fetch(`/api/paddle?${params.toString()}`);
        const data = await response.json();
        if (!response.ok || !data.ok) throw new Error(data.error || 'Paddle refresh failed.');
        currentLookup = data;
        if (card.closest('#todaysPaddleView')) {
          await renderTodaysPaddlePage();
        } else {
          addPaddleCard(data);
        }
        if (!paddleOverlay.hidden && currentLookup?.paddleId === data.paddleId && currentLookup?.serviceDay === data.serviceDay) {
          openPaddleModal(data, currentPaddleOpenSource);
        }
      } catch (_) {
        card.dataset.refreshing = 'false';
      }
    }
