<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Rail Booking Boards</title>
  <style>
    :root {
      --bg: #0b0f14;
      --panel: #161b22;
      --panel-2: #1d242d;
      --text: #f4f7fb;
      --muted: #b9c2ce;
      --border: rgba(255,255,255,.14);
      --accent: #e3432f;
      --accent-2: #ffb068;
      --ok: #74ffad;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: linear-gradient(180deg, #17191d 0%, var(--bg) 36%);
      color: var(--text);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    .app {
      width: min(1180px, calc(100vw - 28px));
      margin: 0 auto;
      padding: 18px 0 32px;
    }
    .header, .page-head, .filter-panel, .board-card {
      border: 1px solid var(--border);
      background: rgba(20,25,32,.88);
      border-radius: 18px;
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 16px;
      margin-bottom: 18px;
    }
    .brand { display: flex; align-items: center; gap: 12px; }
    .badge {
      width: 48px;
      height: 48px;
      border-radius: 14px;
      display: grid;
      place-items: center;
      background: linear-gradient(180deg, #d73a2c, #9f1f17);
      font-weight: 900;
    }
    h1, h2, h3, p { margin: 0; }
    h1 { font-size: clamp(26px, 4vw, 42px); }
    .brand p, .page-head p, .sub, .muted { color: var(--muted); }
    .actions, .switcher, .filter-actions, .chips {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }
    .btn {
      appearance: none;
      border: 1px solid var(--border);
      border-radius: 999px;
      background: rgba(255,255,255,.03);
      color: var(--text);
      padding: 10px 14px;
      font: inherit;
      font-weight: 800;
      text-decoration: none;
      cursor: pointer;
    }
    .btn.active {
      border-color: rgba(255,176,104,.45);
      background: rgba(227,67,47,.20);
      color: #ffe2c6;
    }
    .status {
      border: 1px solid rgba(116,255,173,.22);
      color: var(--ok);
      border-radius: 999px;
      padding: 10px 14px;
      font-weight: 800;
      white-space: nowrap;
    }
    .page-head {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      padding: 18px;
      margin-bottom: 14px;
    }
    .stats {
      display: grid;
      grid-template-columns: repeat(3, minmax(90px, 1fr));
      gap: 8px;
      min-width: min(420px, 100%);
    }
    .stat {
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 10px;
      background: rgba(255,255,255,.03);
    }
    .stat span { display: block; color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: .08em; }
    .stat strong { font-size: 20px; }
    .switcher { margin: 0 0 14px; }
    .filter-panel {
      padding: 14px;
      margin-bottom: 14px;
    }
    .filter-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(150px, 1fr));
      gap: 10px;
    }
    label {
      display: grid;
      gap: 6px;
      color: var(--muted);
      font-size: 12px;
      letter-spacing: .08em;
      text-transform: uppercase;
    }
    input, select {
      width: 100%;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: var(--panel-2);
      color: var(--text);
      padding: 11px 12px;
      font: inherit;
      letter-spacing: 0;
      text-transform: none;
    }
    .filter-actions {
      justify-content: space-between;
      margin-top: 12px;
    }
    .board-list {
      display: grid;
      gap: 12px;
    }
    .board-card {
      padding: 14px;
    }
    .card-head {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: flex-start;
      margin-bottom: 12px;
    }
    .card-head h3 { font-size: 24px; }
    .pill {
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 7px 10px;
      color: var(--muted);
      font-weight: 800;
      white-space: nowrap;
    }
    .pill.open { color: var(--ok); border-color: rgba(116,255,173,.25); }
    .pill.taken { color: #ffb3a8; border-color: rgba(227,67,47,.35); }
    .week-status-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
      white-space: normal;
    }
    .week-status {
      border: 1px solid rgba(116,255,173,.25);
      border-radius: 999px;
      color: var(--ok);
      padding: 2px 7px;
      white-space: nowrap;
    }
    .week-status.taken {
      border-color: rgba(227,67,47,.45);
      color: #ffb3a8;
    }
    .totals, .pieces {
      display: grid;
      grid-template-columns: repeat(4, minmax(120px, 1fr));
      gap: 8px;
    }
    .total, .piece {
      border: 1px solid var(--border);
      border-radius: 12px;
      background: rgba(255,255,255,.03);
      padding: 10px;
    }
    .total strong, .piece strong {
      display: block;
      color: var(--muted);
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: .08em;
      margin-bottom: 4px;
    }
    .piece {
      grid-column: span 2;
      display: grid;
      gap: 6px;
    }
    .piece-title {
      font-weight: 900;
      color: #ffe0c2;
    }
    .spare-group {
      display: grid;
      gap: 12px;
    }
    .spare-group-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
      padding: 4px 2px 0;
    }
    .spare-group-title {
      font-size: 28px;
      line-height: 1;
      margin: 0;
    }
    .spare-group-sub {
      color: var(--muted);
      font-size: 13px;
      line-height: 1.45;
      margin-top: 5px;
    }
    .spare-grid {
      display: grid;
      gap: 12px;
      margin-top: 12px;
    }
    .spare-section-card {
      display: grid;
      gap: 12px;
    }
    .spare-section-table {
      width: 100%;
      border-collapse: collapse;
      border: 1px solid rgba(255,255,255,.08);
      border-radius: 14px;
      overflow: hidden;
      background: rgba(12,16,21,.74);
      table-layout: fixed;
      font-variant-numeric: tabular-nums;
    }
    .spare-section-table th,
    .spare-section-table td {
      padding: 10px 12px;
      text-align: left;
      font-size: 13px;
      border-bottom: 1px solid rgba(255,255,255,.06);
      vertical-align: top;
    }
    .spare-section-table th {
      color: var(--muted);
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: .08em;
      background: rgba(255,255,255,.04);
    }
    .spare-section-table tr:last-child td {
      border-bottom: none;
    }
    .value-cell, .time-cell {
      white-space: nowrap;
    }
    .card-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.72);
      display: grid;
      place-items: center;
      padding: 18px;
      z-index: 20;
    }
    .modal-overlay[hidden] { display: none; }
    .modal {
      width: min(940px, 100%);
      max-height: min(860px, calc(100vh - 28px));
      overflow: auto;
      border: 1px solid var(--border);
      border-radius: 18px;
      background: #111820;
    }
    .modal-head {
      position: sticky;
      top: 0;
      z-index: 1;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 12px;
      padding: 16px;
      border-bottom: 1px solid var(--border);
      background: linear-gradient(180deg, rgba(69,25,23,.96), rgba(17,24,32,.96));
    }
    .modal-body {
      padding: 14px;
      display: grid;
      gap: 10px;
    }
    .trip-card {
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px;
      background: rgba(255,255,255,.03);
    }
    .trip-card strong {
      display: block;
      color: #ffe0c2;
      margin-bottom: 6px;
    }
    .trip-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 8px;
      color: var(--muted);
    }
    .paddle-lookup-card {
      max-width: min(980px, 100%);
      border: 1px solid var(--border);
      border-radius: 20px;
      background: rgba(17,22,28,.95);
      overflow: hidden;
    }
    .paddle-lookup-card .card-head {
      padding: 18px 18px 12px;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 12px;
      margin-bottom: 0;
    }
    .paddle-lookup-card .card-head h3 {
      margin: 0;
      font-size: 38px;
      line-height: 1;
      letter-spacing: -.03em;
    }
    .paddle-lookup-card .card-head p {
      margin: 6px 0 0;
      color: var(--muted);
    }
    .paddle-lookup-card .card-head-right {
      display: flex;
      justify-content: flex-end;
      min-width: max-content;
    }
    .paddle-lookup-card .card-body {
      padding: 0 18px 18px;
    }
    .active-box {
      border: 1px solid rgba(255,176,104,.25);
      background: rgba(255,176,104,.05);
      border-radius: 16px;
      padding: 14px 16px;
      margin-bottom: 14px;
    }
    .active-box-head {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 12px;
    }
    .active-box-copy {
      flex: 1;
      min-width: 0;
    }
    .active-box .title {
      font-size: 28px;
      font-weight: 700;
      line-height: 1.15;
    }
    .action-detail {
      margin-top: 6px;
      color: var(--muted);
      line-height: 1.45;
    }
    .action-mimic {
      margin-top: 14px;
      display: grid;
      grid-template-columns: minmax(0, 1fr) 180px minmax(0, 1fr);
      gap: 14px;
      align-items: center;
    }
    .summary-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 12px;
      margin-bottom: 16px;
    }
    .summary-item {
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 12px;
      background: rgba(255,255,255,.02);
    }
    .summary-item .k {
      font-size: 12px;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: .08em;
      margin-bottom: 4px;
    }
    .summary-item .v {
      font-size: 15px;
      font-weight: 600;
    }
    .entry-card {
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 16px;
      background: rgba(255,255,255,.02);
      margin-bottom: 14px;
    }
    .entry-card.active {
      border-color: rgba(255,176,104,.35);
      background: rgba(255,176,104,.06);
    }
    .entry-lines {
      display: grid;
      gap: 6px;
      font-size: 14px;
    }
    .block-stack {
      display: grid;
      gap: 10px;
    }
    .entry-head {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: baseline;
      gap: 12px;
      margin-bottom: 12px;
    }
    .entry-head h4 {
      justify-self: start;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin: 0;
      font-size: 21px;
    }
    .entry-direction {
      justify-self: center;
      font-size: 13px;
      text-transform: uppercase;
      letter-spacing: .08em;
      color: var(--muted);
      white-space: nowrap;
    }
    .entry-block {
      justify-self: end;
      font-size: 18px;
      font-weight: 800;
      color: var(--accent-2);
      letter-spacing: .02em;
    }
    .radio-check {
      display: inline-flex;
      align-items: center;
      padding: 4px 8px;
      border-radius: 999px;
      border: 1px solid rgba(116,255,173,.26);
      background: rgba(116,255,173,.10);
      color: var(--ok);
      font-size: 11px;
      font-weight: 800;
      letter-spacing: .04em;
      text-transform: uppercase;
      white-space: nowrap;
    }
    .trip-row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 170px minmax(0, 1fr);
      gap: 14px;
      align-items: center;
      padding: 12px 14px;
      border-radius: 16px;
      background: rgba(255,255,255,.03);
      border: 1px solid rgba(255,255,255,.06);
    }
    .trip-row.active-trip {
      border-color: rgba(255,176,104,.45);
      background: linear-gradient(90deg, rgba(255,176,104,.08), rgba(255,255,255,.02));
      box-shadow: 0 0 0 1px rgba(255,176,104,.12) inset;
    }
    .trip-side { min-width: 0; }
    .trip-side.end { text-align: right; }
    .trip-stop {
      font-weight: 700;
      font-size: 18px;
      line-height: 1.15;
      color: #f7f8fb;
      overflow-wrap: anywhere;
    }
    .trip-time {
      margin-top: 4px;
      font-size: 24px;
      font-weight: 800;
      color: var(--accent-2);
      letter-spacing: 0;
    }
    .trip-center {
      display: grid;
      gap: 8px;
      justify-items: center;
    }
    .trip-duration {
      font-size: 13px;
      text-transform: uppercase;
      letter-spacing: .08em;
      color: var(--muted);
    }
    .trip-rail {
      position: relative;
      width: 100%;
      height: 18px;
    }
    .trip-rail::before {
      content: "";
      position: absolute;
      left: 0;
      right: 0;
      top: 50%;
      height: 3px;
      border-radius: 999px;
      transform: translateY(-50%);
      background: linear-gradient(90deg, rgba(169,198,255,.18), rgba(255,176,104,.35), rgba(169,198,255,.18));
    }
    .trip-train {
      position: absolute;
      top: 50%;
      left: var(--train-progress, 50%);
      transform: translate(-50%, -50%);
      filter: drop-shadow(0 0 8px rgba(255,176,104,.22));
    }
    .otrain-icon {
      width: 20px;
      height: 20px;
      display: inline-block;
    }
    .trip-subtext {
      font-size: 12px;
      color: var(--muted);
      margin-top: 4px;
    }
    .break-strip {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 8px 12px;
      border-radius: 999px;
      border: 1px dashed rgba(255,255,255,.15);
      background: rgba(255,255,255,.02);
      color: var(--muted);
      font-size: 13px;
    }
    .break-strip.split-break {
      justify-content: stretch;
      border-style: solid;
      border-color: rgba(255,176,104,.24);
      background: linear-gradient(90deg, rgba(255,176,104,.08), rgba(255,255,255,.025));
      border-radius: 16px;
      padding: 12px 14px;
      text-align: center;
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      gap: 12px;
    }
    .break-pill {
      color: var(--accent-2);
      font-weight: 700;
    }
    .break-title {
      font-weight: 800;
      color: var(--text);
      letter-spacing: .02em;
    }
    .break-detail {
      color: var(--muted);
      font-size: 13px;
      margin-top: 2px;
    }
    .split-side { min-width: 0; }
    .split-side.left { text-align: left; }
    .split-side.right { text-align: right; }
    .split-label {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: .08em;
      color: var(--muted);
      margin-bottom: 2px;
    }
    .split-time {
      font-size: 20px;
      font-weight: 800;
      color: var(--text);
    }
    .split-center {
      min-width: 170px;
    }
    .empty {
      border: 1px dashed var(--border);
      border-radius: 14px;
      padding: 18px;
      color: var(--muted);
      text-align: center;
    }
    @media (max-width: 820px) {
      .header, .page-head, .card-head { flex-direction: column; }
      .filter-grid, .stats, .totals, .pieces { grid-template-columns: 1fr; }
      .piece { grid-column: span 1; }
      .actions { width: 100%; }
      .card-actions { justify-content: flex-start; }
      .trip-grid { grid-template-columns: 1fr; }
      .paddle-lookup-card .card-head {
        flex-direction: row;
        align-items: flex-start;
      }
      .paddle-lookup-card .card-head h3 {
        font-size: 34px;
      }
      .active-box .title {
        font-size: 22px;
      }
      .action-mimic,
      .trip-row {
        grid-template-columns: minmax(0, 1fr) 92px minmax(0, 1fr);
        gap: 8px;
      }
      .entry-head {
        grid-template-columns: 1fr;
      }
      .entry-direction,
      .entry-block {
        justify-self: start;
        text-align: left;
      }
      .trip-row {
        padding: 10px;
      }
      .trip-side.end {
        justify-self: end;
        text-align: right;
      }
      .trip-stop {
        font-size: 14px;
      }
      .trip-time {
        font-size: 18px;
      }
      .trip-duration {
        font-size: 11px;
      }
      .break-strip.split-break {
        grid-template-columns: 1fr;
      }
      .split-side.left,
      .split-side.right {
        text-align: center;
      }
      .split-center {
        min-width: 0;
      }
      .btn, .status { flex: 1; text-align: center; }
    }
  </style>
</head>
<body>
  <main class="app">
    <header class="header">
      <div class="brand">
        <div class="badge">ER</div>
        <div>
          <h1>Rail Booking Boards</h1>
          <p>Filter ERO board work by day, week, start location, and report time.</p>
        </div>
      </div>
      <div class="actions">
        <a class="btn" href="/">Back to ERO Tool</a>
        <button id="refreshBtn" class="btn" type="button">Refresh</button>
        <div id="status" class="status">Loading</div>
      </div>
    </header>

    <section class="page-head">
      <div>
        <h2>Booking Boards</h2>
        <p>Open work and X-marked work are kept in the same board view. Use the filters to narrow the list before reviewing the pieces.</p>
      </div>
      <div id="stats" class="stats"></div>
    </section>

    <section id="switcher" class="switcher"></section>
    <section id="filters" class="filter-panel"></section>
    <section id="boardList" class="board-list"></section>
  </main>

  <div id="paddleOverlay" class="modal-overlay" hidden>
    <section class="modal" role="dialog" aria-modal="true" aria-labelledby="paddleTitle">
      <header class="modal-head">
        <div>
          <h2 id="paddleTitle">Paddle</h2>
          <p id="paddleMeta" class="sub"></p>
        </div>
        <button id="closePaddleBtn" class="btn" type="button">Close</button>
      </header>
      <div id="paddleBody" class="modal-body"></div>
    </section>
  </div>

  <script>
    const statusEl = document.getElementById('status');
    const refreshBtn = document.getElementById('refreshBtn');
    const switcher = document.getElementById('switcher');
    const filtersEl = document.getElementById('filters');
    const boardList = document.getElementById('boardList');
    const statsEl = document.getElementById('stats');
    const paddleOverlay = document.getElementById('paddleOverlay');
    const paddleTitle = document.getElementById('paddleTitle');
    const paddleMeta = document.getElementById('paddleMeta');
    const paddleBody = document.getElementById('paddleBody');
    const closePaddleBtn = document.getElementById('closePaddleBtn');

    let state = { boards: [], selectedBoardId: '', board: null };
    let filters = {
      shift: '',
      workType: 'all',
      status: 'open',
      week: 'any-open',
      startBucket: '',
      endBucket: '',
      onAfter: '',
      onBefore: '',
      sortBy: 'board',
    };

    function escapeHtml(value) {
      return String(value ?? '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function timeToMinutes(value) {
      const match = String(value || '').match(/^(\d{1,2}):(\d{2})$/);
      if (!match) return null;
      return Number(match[1]) * 60 + Number(match[2]);
    }

    function uniqueSorted(values) {
      return [...new Set(values.map((value) => String(value || '').trim()).filter(Boolean))]
        .sort((a, b) => a.localeCompare(b, undefined, { numeric: true, sensitivity: 'base' }));
    }

    function renderOptions(values, selected) {
      return values.map((value) => `<option value="${escapeHtml(value)}" ${value === selected ? 'selected' : ''}>${escapeHtml(value)}</option>`).join('');
    }

    function entryOpenForWeek(entry, week) {
      if (week === 'week1') return !entry.week1Taken;
      if (week === 'week2') return !entry.week2Taken;
      if (week === 'both') return !entry.week1Taken && !entry.week2Taken;
      return !entry.week1Taken || !entry.week2Taken;
    }

    function entryMatches(entry) {
      const pieces = Array.isArray(entry.pieces) ? entry.pieces : [];
      if (filters.shift && !String(entry.workId || '').toLowerCase().includes(filters.shift.toLowerCase())) return false;
      if (filters.workType !== 'all' && entry.workType !== filters.workType) return false;
      if (filters.status === 'open' && entry.taken) return false;
      if (filters.status === 'taken' && !entry.taken) return false;
      if (filters.week !== 'all' && !entryOpenForWeek(entry, filters.week === 'any-open' ? '' : filters.week)) return false;
      if (filters.startBucket && !pieces.some((piece) => piece.startBucket === filters.startBucket)) return false;
      if (filters.endBucket && !pieces.some((piece) => piece.endBucket === filters.endBucket)) return false;
      const after = timeToMinutes(filters.onAfter);
      const before = timeToMinutes(filters.onBefore);
      if (after !== null && !pieces.some((piece) => {
        const minutes = timeToMinutes(piece.startTime);
        return minutes !== null && minutes >= after;
      })) return false;
      if (before !== null && !pieces.some((piece) => {
        const minutes = timeToMinutes(piece.startTime);
        return minutes !== null && minutes <= before;
      })) return false;
      return true;
    }

    function entrySortStats(entry) {
      const pieces = Array.isArray(entry.pieces) ? entry.pieces : [];
      const starts = pieces.map((piece) => timeToMinutes(piece.startTime)).filter((value) => value !== null);
      const ends = pieces.map((piece) => timeToMinutes(piece.endTime)).filter((value) => value !== null);
      const paid = timeToMinutes(entry.paidTime) ?? 0;
      return {
        start: starts.length ? Math.min(...starts) : Number.POSITIVE_INFINITY,
        end: ends.length ? Math.max(...ends) : Number.POSITIVE_INFINITY,
        paid,
      };
    }

    function sortEntries(entries) {
      if (filters.sortBy === 'board') return entries;
      return entries.map((entry, index) => ({ entry, index, stats: entrySortStats(entry) }))
        .sort((a, b) => {
          if (filters.sortBy === 'most-pay') return b.stats.paid - a.stats.paid || a.index - b.index;
          if (filters.sortBy === 'earliest-start') return a.stats.start - b.stats.start || a.index - b.index;
          if (filters.sortBy === 'latest-start') return b.stats.start - a.stats.start || a.index - b.index;
          if (filters.sortBy === 'earliest-finish') return a.stats.end - b.stats.end || a.index - b.index;
          if (filters.sortBy === 'latest-finish') return b.stats.end - a.stats.end || a.index - b.index;
          return a.index - b.index;
        })
        .map((item) => item.entry);
    }

    function renderSwitcher() {
      switcher.innerHTML = state.boards.map((board) => `
        <button class="btn ${board.id === state.selectedBoardId ? 'active' : ''}" type="button" data-board-id="${escapeHtml(board.id)}">

    function renderFilters(entries, shownCount) {

        ['blair', 'Blair'],
        ['tunneys', "Tunney's"],
        ['msf', 'MSF / PHD'],
      ].filter(([key]) => entries.some((entry) => (entry.pieces || []).some((piece) => piece.startBucket === key)));
      const endBuckets = [
        ['blair', 'Blair'],
        ['tunneys', "Tunney's"],
        ['msf', 'MSF / PHD'],
      ].filter(([key]) => entries.some((entry) => (entry.pieces || []).some((piece) => piece.endBucket === key)));
      filtersEl.innerHTML = `
        <div class="filter-grid">
          <label>Work number
            <input type="search" value="${escapeHtml(filters.shift)}" placeholder="1-23" data-filter="shift">

          <label>Week
            <select data-filter="week">
              <option value="any-open" ${filters.week === 'any-open' ? 'selected' : ''}>Any open week</option>

              <option value="week1" ${filters.week === 'week1' ? 'selected' : ''}>Week 1 open</option>
              <option value="week2" ${filters.week === 'week2' ? 'selected' : ''}>Week 2 open</option>
              <option value="all" ${filters.week === 'all' ? 'selected' : ''}>All weeks</option>
            </select>
          </label>
          <label>Start location
            <select data-filter="startBucket">
              <option value="">Any start</option>
              ${startBuckets.map(([key, label]) => `<option value="${escapeHtml(key)}" ${filters.startBucket === key ? 'selected' : ''}>${escapeHtml(label)}</option>`).join('')}
            </select>
          </label>
          <label>End location
            <select data-filter="endBucket">
              <option value="">Any end</option>
              ${endBuckets.map(([key, label]) => `<option value="${escapeHtml(key)}" ${filters.endBucket === key ? 'selected' : ''}>${escapeHtml(label)}</option>`).join('')}

          </label>
          <label>Start after
            <input type="time" value="${escapeHtml(filters.onAfter)}" data-filter="onAfter">
          </label>
          <label>Start before
            <input type="time" value="${escapeHtml(filters.onBefore)}" data-filter="onBefore">
          </label>
          <label>Sort
            <select data-filter="sortBy">
              <option value="board" ${filters.sortBy === 'board' ? 'selected' : ''}>Board order</option>
              <option value="most-pay" ${filters.sortBy === 'most-pay' ? 'selected' : ''}>Most pay</option>
              <option value="earliest-start" ${filters.sortBy === 'earliest-start' ? 'selected' : ''}>Earliest start</option>
              <option value="latest-start" ${filters.sortBy === 'latest-start' ? 'selected' : ''}>Latest start</option>
              <option value="earliest-finish" ${filters.sortBy === 'earliest-finish' ? 'selected' : ''}>Earliest finish</option>
              <option value="latest-finish" ${filters.sortBy === 'latest-finish' ? 'selected' : ''}>Latest finish</option>

        </div>
      `;
    }

    function renderWeekLabel(entry) {
      return `
        <span class="week-status ${entry.week1Taken ? 'taken' : ''}">Week 1 ${entry.week1Taken ? 'taken' : 'open'}</span>
        <span class="week-status ${entry.week2Taken ? 'taken' : ''}">Week 2 ${entry.week2Taken ? 'taken' : 'open'}</span>
      `;
    }

    function serviceDayForBoard(boardKey) {
      if (['mon_thu', 'friday', 'saturday', 'sunday'].includes(boardKey)) return boardKey;
      return '';
    }

    function renderPaddleButton(entry) {
      if (entry.kind === 'spare') return '';
      const serviceDay = serviceDayForBoard(entry.boardKey);
      if (!serviceDay) {
        return '<button class="btn" type="button" disabled>No holiday paddle link</button>';
      }
      return `<button class="btn" type="button" data-open-paddle="${escapeHtml(entry.workId)}" data-service-day="${escapeHtml(serviceDay)}">View Paddle</button>`;
    }

    function renderSpareEntry(entry) {
      const available = Number(entry.available || 0);
      return `
        <article class="board-card">
          <div class="card-head">
            <div>
              <h3>${escapeHtml(entry.spareTime || entry.workId)}</h3>
              <p class="sub">${escapeHtml(entry.sectionLabel)} · Source page ${escapeHtml(entry.page || 'N/A')}</p>
            </div>
            <div class="card-actions">
              <div class="pill ${available > 0 ? 'open' : 'taken'}">${available > 0 ? `${escapeHtml(available)} available` : 'Full'}</div>
            </div>
          </div>
          <div class="totals">
            <div class="total"><strong>Limit</strong>${escapeHtml(entry.limit ?? 'N/A')}</div>
            <div class="total"><strong>Booked</strong>${escapeHtml(entry.booked ?? 'N/A')}</div>
            <div class="total"><strong>Available</strong>${escapeHtml(entry.available ?? 'N/A')}</div>
            <div class="total"><strong>Source</strong>${escapeHtml(entry.sourceFile || 'N/A')}</div>
          </div>
        </article>
      `;
    }

    function buildSpareSections(entries) {
      const sections = new Map();
      entries.forEach((entry) => {
        const title = String(entry.sectionLabel || 'Spare board').trim() || 'Spare board';
        if (!sections.has(title)) {
          sections.set(title, {
            title,
            page: entry.page || '',
            sourceFile: entry.sourceFile || '',
            slots: [],
            limitTotal: 0,
            bookedTotal: 0,
            availableTotal: 0,
          });
        }
        const section = sections.get(title);
        const slot = {
          onTime: entry.spareTime || entry.workId || 'N/A',
          limit: Number(entry.limit || 0) || 0,
          booked: Number(entry.booked || 0) || 0,
          available: Number(entry.available || 0) || 0,
        };
        section.slots.push(slot);
        section.limitTotal += slot.limit;
        section.bookedTotal += slot.booked;
        section.availableTotal += slot.available;
      });
      return Array.from(sections.values()).sort((a, b) => {
        const pageDiff = (Number(a.page || 0) || 0) - (Number(b.page || 0) || 0);
        return pageDiff || a.title.localeCompare(b.title, undefined, { numeric: true, sensitivity: 'base' });
      });
    }

    function renderSpareBoard(board, entries) {
      const sections = buildSpareSections(entries);
      if (!sections.length) {
        filtersEl.innerHTML = '';
        boardList.innerHTML = '<div class="empty">No spare-board availability was parsed yet.</div>';
        return;
      }
      const availableTotal = sections.reduce((sum, section) => sum + section.availableTotal, 0);
      const bookedTotal = sections.reduce((sum, section) => sum + section.bookedTotal, 0);
      const limitTotal = sections.reduce((sum, section) => sum + section.limitTotal, 0);
      filtersEl.innerHTML = `
        <div class="filter-actions" style="margin-top:0;">
          <div class="muted">Spare boards are grouped by the PDF section, like the bus booking board view.</div>
        </div>
      `;
      boardList.innerHTML = `
        <section class="spare-group">
          <div class="spare-group-head">
            <div>
              <h3 class="spare-group-title">${escapeHtml(board?.title || 'Spare Board')}</h3>
              <div class="spare-group-sub">Review spare availability by section. Full sections stay visible so the booked and limit counts can be checked.</div>
            </div>
            <div class="totals" style="grid-template-columns: repeat(3, minmax(110px, 1fr));">
              <div class="total"><strong>Available</strong>${escapeHtml(availableTotal)}</div>
              <div class="total"><strong>Booked</strong>${escapeHtml(bookedTotal)}</div>
              <div class="total"><strong>Limit</strong>${escapeHtml(limitTotal)}</div>
            </div>
          </div>
          ${sections.map((section) => `
            <article class="board-card spare-section-card">
              <div class="card-head">
                <div>
                  <h3>${escapeHtml(section.title)}</h3>
                  <p class="sub">${section.page ? `Source page ${escapeHtml(section.page)}` : 'Source page not listed'} · ${escapeHtml(section.sourceFile || 'PDF source')}</p>
                </div>
                <div class="card-actions">
                  <div class="pill ${section.availableTotal > 0 ? 'open' : 'taken'}">${section.availableTotal > 0 ? `${escapeHtml(section.availableTotal)} spots open` : 'No open spots'}</div>
                </div>
              </div>
              <div class="totals">
                <div class="total"><strong>Available</strong>${escapeHtml(section.availableTotal)}</div>
                <div class="total"><strong>Booked</strong>${escapeHtml(section.bookedTotal)}</div>
                <div class="total"><strong>Limit</strong>${escapeHtml(section.limitTotal)}</div>
                <div class="total"><strong>Rows</strong>${escapeHtml(section.slots.length)}</div>
              </div>
              <table class="spare-section-table">
                <thead>
                  <tr>
                    <th class="time-cell">On Time</th>
                    <th class="value-cell">Limit</th>
                    <th class="value-cell">Booked</th>
                    <th class="value-cell">Available</th>
                  </tr>
                </thead>
                <tbody>
                  ${section.slots.map((slot) => `
                    <tr>
                      <td class="time-cell">${escapeHtml(slot.onTime)}</td>
                      <td class="value-cell">${escapeHtml(slot.limit)}</td>
                      <td class="value-cell">${escapeHtml(slot.booked)}</td>
                      <td class="value-cell">${escapeHtml(slot.available)}</td>
                    </tr>
                  `).join('')}
                </tbody>
              </table>
            </article>
          `).join('')}
        </section>
      `;
    }

    function renderEntry(entry) {
      if (entry.kind === 'spare') return renderSpareEntry(entry);
      const pieces = Array.isArray(entry.pieces) ? entry.pieces : [];
      return `
        <article class="board-card">
          <div class="card-head">
            <div>
              <h3>${escapeHtml(entry.workId)}</h3>
              <p class="sub">${escapeHtml(entry.sectionLabel)} · Board page ${escapeHtml(entry.page || 'N/A')}</p>
            </div>
            <div class="card-actions">
              <div class="pill week-status-pill">${renderWeekLabel(entry)}</div>
              ${renderPaddleButton(entry)}
            </div>
          </div>
          <div class="totals">
            <div class="total"><strong>Start</strong>${escapeHtml(entry.startLocation || 'N/A')} ${escapeHtml(entry.startTime || '')}</div>
            <div class="total"><strong>Finish</strong>${escapeHtml(entry.endLocation || 'N/A')} ${escapeHtml(entry.endTime || '')}</div>
            <div class="total"><strong>Platform</strong>${escapeHtml(entry.platformTime || 'N/A')}</div>
            <div class="total"><strong>Pay</strong>${escapeHtml(entry.paidTime || 'N/A')}</div>
          </div>
          <div class="pieces" style="margin-top:8px;">
            ${pieces.map((piece, index) => `
              <section class="piece">
                <strong>${entry.pieceCount > 1 ? `Piece ${index + 1}` : 'Piece'}</strong>
                <div class="piece-title">${escapeHtml(piece.from)} to ${escapeHtml(piece.to)}</div>
                <div>${escapeHtml(piece.startTime)} to ${escapeHtml(piece.endTime)} · ${escapeHtml(piece.duration)} platform</div>
                <div class="muted">Start: ${escapeHtml(piece.startBucketLabel || 'MSF / PHD')} · End: ${escapeHtml(piece.endBucketLabel || 'MSF / PHD')}</div>
              </section>
            `).join('')}
          </div>
        </article>
      `;
    }

    function formatDurationMinutes(minutes) {
      const total = Number(minutes);
      if (!Number.isFinite(total) || total <= 0) return '0 min';
      const hours = Math.floor(total / 60);
      const mins = total % 60;
      if (!hours) return `${mins} min`;
      return mins ? `${hours}h ${mins}m` : `${hours}h`;
    }

    function renderTrainIcon() {
      return '<svg class="otrain-icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="6" width="14" height="9" rx="2" fill="#ffb068"/><rect x="7" y="8" width="4" height="3" rx="0.8" fill="#1c2128"/><rect x="13" y="8" width="4" height="3" rx="0.8" fill="#1c2128"/><path d="M8 18h8" stroke="#ffb068" stroke-width="1.8" stroke-linecap="round"/><circle cx="9" cy="17" r="1.3" fill="#f2f4f8"/><circle cx="15" cy="17" r="1.3" fill="#f2f4f8"/></svg>';
    }

    function formatPaddleStatusPill(live) {
      if (!live) return 'loaded';
      if (live.kind === 'trip') return 'live';
      if (live.kind === 'break') return live.splitBreak ? 'on split' : 'on break';
      if (live.kind === 'complete') return 'done';
      if (live.kind === 'clearing') return 'clearing';
      if (live.kind === 'prestart') return 'upcoming';
      return 'loaded';
    }

    function getNextAction(live) {
      if (!live) return { title: 'Paddle loaded.', detail: '' };
      if (live.kind === 'trip') {
        const tripName = live.sequence && live.directionLabel ? `Trip ${live.sequence} - ${live.directionLabel}` : `Trip ${live.sequence || ''}`.trim();
        return { title: tripName || 'Active trip', detail: live.block ? `Block ${live.block}` : '' };
      }
      if (live.kind === 'prestart') {
        const place = live.nextStartStop || live.reportPlaceName || 'start point';
        const time = live.nextStartTime || live.reportTime || live.targetTime || '';
        return { title: `Depart ${place}${time ? ` at ${time}` : ''}`, detail: live.block ? `Block ${live.block}` : '' };
      }
      if (live.kind === 'break') {
        const time = live.nextStartTime || live.targetTime || '';
        return {
          title: live.splitBreak ? `Split ends${time ? ` at ${time}` : ''}` : `Break until Trip ${live.nextSequence || ''}${time ? ` at ${time}` : ''}`.trim(),
          detail: live.nextStartStop ? `Next start: ${live.nextStartStop}` : '',
        };
      }
      if (live.kind === 'clearing') {
        return { title: live.label || `Clear block ${live.block || ''}`.trim(), detail: live.directionLabel || '' };
      }
      return { title: live.label || 'Paddle loaded.', detail: '' };
    }

    function renderNextActionBox(live) {
      if (!live) return '<div class="active-box"><div class="title">Paddle loaded.</div></div>';
      const action = getNextAction(live);
      const mimic = live.kind === 'trip' ? `
        <div class="action-mimic">
          <div class="trip-side start">
            <div class="trip-stop">${escapeHtml(live.startStop || '')}</div>
            <div class="trip-time">${escapeHtml(live.startTime || '')}</div>
          </div>
          <div class="trip-center">
            <div class="trip-rail"><span class="trip-train">${renderTrainIcon()}</span></div>
          </div>
          <div class="trip-side end">
            <div class="trip-stop">${escapeHtml(live.endStop || '')}</div>
            <div class="trip-time">${escapeHtml(live.endTime || '')}</div>
          </div>
        </div>
      ` : '';
      return `
        <div class="active-box">
          <div class="active-box-head">
            <div class="active-box-copy">
              <div class="title">${escapeHtml(action.title)}</div>
              ${action.detail ? `<div class="action-detail">${escapeHtml(action.detail)}</div>` : ''}
            </div>
          </div>
          ${mimic}
        </div>
      `;
    }

    function renderPieceSummaryItems(data) {
      const pieces = Array.isArray(data.pieceSummaries) ? data.pieceSummaries : [];
      if (pieces.length > 1) {
        return pieces.map((piece, index) => {
          const label = index === 0 ? '1st piece' : index === 1 ? '2nd piece' : `${index + 1}th piece`;
          return `
            <div class="summary-item"><div class="k">${escapeHtml(label)} start</div><div class="v">${escapeHtml(piece.start || 'N/A')}</div></div>
            <div class="summary-item"><div class="k">${escapeHtml(label)} clear</div><div class="v">${escapeHtml(piece.clear || 'N/A')}</div></div>
          `;
        }).join('');
      }
      return `
        <div class="summary-item"><div class="k">Start</div><div class="v">${escapeHtml(data.firstReportTime || pieces[0]?.start || 'N/A')}</div></div>
        <div class="summary-item"><div class="k">Clear</div><div class="v">${escapeHtml(data.finalClearTime || pieces[0]?.clear || 'N/A')}</div></div>
      `;
    }

    function renderSplitSummaryItems(data) {
      const splits = Array.isArray(data.splitBreaks) ? data.splitBreaks : [];
      if (!splits.length) return '';
      return splits.map((split, index) => {
        const label = splits.length === 1 ? 'Split break' : `Split break ${index + 1}`;
        const detail = `${formatDurationMinutes(split.durationMinutes)}${split.clearTime && split.backTime ? ` (${split.clearTime}-${split.backTime})` : ''}`;
        return `<div class="summary-item"><div class="k">${escapeHtml(label)}</div><div class="v">${escapeHtml(detail)}</div></div>`;
      }).join('');
    }

    function deriveEntryDirection(entry) {
      const firstTrip = (entry.trips || [])[0] || null;
      const startStop = String(firstTrip?.startStop || '').toLowerCase();
      const endStop = String(firstTrip?.endStop || '').toLowerCase();
      if ((startStop.includes('blair') || startStop.includes("tunney")) && (endStop.includes('pexite') || endStop.includes('pexitw'))) return 'Reduction';
      if (startStop.includes('phnd') && endStop.includes('tremblay')) return 'Launching West';
      if (startStop.includes('phnd') && (endStop.includes('st laurent') || endStop.includes('st-laurent'))) return 'Launching East';
      if (endStop.includes('blair')) return 'East to Blair';
      if (endStop.includes("tunney")) return "West to Tunney's";
      return '';
    }

    function renderTripRow(entry, trip, live) {
      const isActiveTrip = Boolean(live && live.kind === 'trip' && String(live.block || '') === String(entry.block || '') && String(live.tripId || '') === String(trip.tripId || ''));
      return `
        <div class="trip-row${isActiveTrip ? ' active-trip' : ''}">
          <div class="trip-side start">
            <div class="trip-stop">${escapeHtml(trip.startStop || '')}</div>
            <div class="trip-time">${escapeHtml(trip.startTime || '')}</div>
            <div class="trip-subtext">&nbsp;</div>
          </div>
          <div class="trip-center">
            <div class="trip-duration">${typeof trip.durationMinutes === 'number' ? `${escapeHtml(trip.durationMinutes)} min` : 'In service'}</div>
            <div class="trip-rail"><span class="trip-train">${renderTrainIcon()}</span></div>
          </div>
          <div class="trip-side end">
            <div class="trip-stop">${escapeHtml(trip.endStop || '')}</div>
            <div class="trip-time">${escapeHtml(trip.endTime || '')}</div>
            <div class="trip-subtext">${isActiveTrip ? 'Live now' : '&nbsp;'}</div>
          </div>
        </div>
      `;
    }

    function renderEntryCard(entry, live) {
      const directionLabel = deriveEntryDirection(entry);
      const tripRows = (entry.trips || []).map((trip) => renderTripRow(entry, trip, live)).join('');
      const isLiveBreak = Boolean(live && live.kind === 'break' && String(live.block || '') === String(entry.block || '') && String(live.sequence || '') === String(entry.sequence || ''));
      const isSplitBreak = typeof entry.breakAfterMinutes === 'number' && entry.breakAfterMinutes >= 90;
      const breakStrip = typeof entry.breakAfterMinutes === 'number' && entry.breakAfterMinutes > 0
        ? isSplitBreak
          ? `
            <div class="break-strip split-break${isLiveBreak ? ' active-break' : ''}">
              <div class="split-side left">
                <div class="split-label">Clear</div>
                <div class="split-time">${escapeHtml(entry.clearTime || entry.endTime || '')}</div>
              </div>
              <div class="split-center">
                <div class="break-title">Split break</div>
                <div class="break-detail">${escapeHtml(formatDurationMinutes(entry.breakAfterMinutes))}</div>
              </div>
              <div class="split-side right">
                <div class="split-label">Back</div>
                <div class="split-time">${escapeHtml(entry.nextBlockReportTime || entry.nextBlockStartTime || '')}</div>
              </div>
            </div>
          `
          : `<div class="break-strip${isLiveBreak ? ' active-break' : ''}"><span class="break-pill">Break ${escapeHtml(entry.breakAfterMinutes)} min</span></div>`
        : '';
      return `
        <div class="block-stack">
          <article class="entry-card${live && live.kind === 'trip' && String(live.block || '') === String(entry.block || '') && String(live.sequence || '') === String(entry.sequence || '') ? ' active' : ''}">
            <div class="entry-head">
              <h4>
                <span>Trip ${escapeHtml(entry.sequence)}</span>
                ${entry.radioCheckNeeded ? '<span class="radio-check">Radio check required</span>' : ''}
              </h4>
              <div class="entry-direction">${escapeHtml(directionLabel)}</div>
              <div class="entry-block">Block ${escapeHtml(entry.block)}</div>
            </div>
            <div class="entry-lines">${tripRows}</div>
          </article>
          ${breakStrip}
        </div>
      `;
    }

    function renderLookupStylePaddle(data) {
      const live = data.liveStatus || null;
      return `
        <article class="paddle-lookup-card">
          <div class="card-head">
            <div>
              <h3>${escapeHtml(data.paddleId)}</h3>
              <p>${escapeHtml(data.serviceLabel)} service</p>
            </div>
            <div class="card-head-right">
              <span class="pill">${escapeHtml(formatPaddleStatusPill(live))}</span>
            </div>
          </div>
          <div class="card-body">
            ${renderNextActionBox(live)}
            <div class="summary-grid">
              ${renderPieceSummaryItems(data)}
              ${renderSplitSummaryItems(data)}
              <div class="summary-item"><div class="k">Blocks</div><div class="v">${escapeHtml(data.entries?.length || 0)}</div></div>
              <div class="summary-item"><div class="k">Effective</div><div class="v">${escapeHtml(data.effective || 'N/A')}</div></div>
            </div>
            ${(data.entries || []).map((entry) => renderEntryCard(entry, live)).join('')}
          </div>
        </article>
      `;
    }

    async function openPaddle(paddleId, serviceDay) {
      statusEl.textContent = 'Loading paddle...';
      try {
        const params = new URLSearchParams({ id: paddleId });
        if (serviceDay) params.set('day', serviceDay);
        const response = await fetch(`/api/paddle?${params.toString()}`);
        const data = await response.json();
        if (!response.ok || !data.ok) throw new Error(data.error || 'Paddle lookup failed');
        paddleTitle.textContent = `Paddle ${data.paddleId || paddleId}`;
        paddleMeta.textContent = `${data.serviceLabel || serviceDay || 'Service'} · ${data.dutyType || ''}`.trim();
        paddleBody.innerHTML = renderLookupStylePaddle(data);
        paddleOverlay.hidden = false;
        document.body.style.overflow = 'hidden';
        statusEl.textContent = 'Paddle ready';
      } catch (error) {
        statusEl.textContent = 'Paddle failed';
        alert(error.message || 'Paddle lookup failed.');
      }
    }

    function closePaddle() {
      paddleOverlay.hidden = true;
      document.body.style.overflow = '';
    }

    function renderBoard() {
      const board = state.board;
      const entries = Array.isArray(board?.entries) ? board.entries : [];
      const isSpareBoard = entries.some((entry) => entry.kind === 'spare' || entry.workType === 'spare');
      if (isSpareBoard) {
        const availableTotal = entries.reduce((sum, entry) => sum + (Number(entry.available || 0) || 0), 0);
        const bookedTotal = entries.reduce((sum, entry) => sum + (Number(entry.booked || 0) || 0), 0);
        statsEl.innerHTML = `
          <div class="stat"><span>Sections</span><strong>${escapeHtml(buildSpareSections(entries).length)}</strong></div>
          <div class="stat"><span>Available</span><strong>${escapeHtml(availableTotal)}</strong></div>
          <div class="stat"><span>Booked</span><strong>${escapeHtml(bookedTotal)}</strong></div>
        `;
        renderSpareBoard(board, entries);
        return;
      }
      const shown = sortEntries(entries.filter(entryMatches));
      const openCount = entries.filter((entry) => !entry.taken).length;
      const partialCount = entries.filter((entry) => entry.week1Taken !== entry.week2Taken).length;
      statsEl.innerHTML = `
        <div class="stat"><span>Entries</span><strong>${escapeHtml(entries.length)}</strong></div>
        <div class="stat"><span>Available</span><strong>${escapeHtml(openCount)}</strong></div>
        <div class="stat"><span>Partly taken</span><strong>${escapeHtml(partialCount)}</strong></div>
      `;
      renderFilters(entries, shown.length);
      boardList.innerHTML = shown.length
        ? shown.map(renderEntry).join('')
        : '<div class="empty">No board work matches these filters.</div>';
    }

    async function loadBoard(boardId = '') {
      statusEl.textContent = 'Loading...';
      try {
        const qs = boardId ? `?board=${encodeURIComponent(boardId)}` : '';
        const response = await fetch(`/api/rail-boards${qs}`);
        const data = await response.json();
        if (!response.ok || !data.ok) throw new Error(data.error || 'Rail boards failed');
        state = data;
        renderSwitcher();
        renderBoard();
        statusEl.textContent = state.board ? 'Boards ready' : 'No board';
      } catch (error) {
        statusEl.textContent = 'Error';
        boardList.innerHTML = `<div class="empty">${escapeHtml(error.message || 'Rail boards failed.')}</div>`;
      }
    }

    switcher.addEventListener('click', (event) => {
      const button = event.target.closest('[data-board-id]');
      if (!button) return;
      loadBoard(button.dataset.boardId || '');
    });

    boardList.addEventListener('click', (event) => {
      const button = event.target.closest('[data-open-paddle]');
      if (!button) return;
      openPaddle(button.dataset.openPaddle || '', button.dataset.serviceDay || '');
    });

    filtersEl.addEventListener('input', (event) => {
      const field = event.target.closest('[data-filter]');
      if (!field) return;
      filters[field.dataset.filter] = field.value;
      renderBoard();
      const next = filtersEl.querySelector(`[data-filter="${field.dataset.filter}"]`);
      if (next) {
        next.focus();
        if (typeof next.setSelectionRange === 'function') {
          const length = String(next.value || '').length;
          next.setSelectionRange(length, length);
        }
      }
    });

    filtersEl.addEventListener('change', (event) => {
      const field = event.target.closest('[data-filter]');
      if (!field) return;
      filters[field.dataset.filter] = field.value;
      renderBoard();
    });

    filtersEl.addEventListener('click', (event) => {
      if (!event.target.closest('[data-clear-filters]')) return;
      filters = {
        shift: '',
        workType: 'all',
        status: 'open',
        week: 'any-open',
        startBucket: '',
        endBucket: '',
        onAfter: '',
        onBefore: '',
        sortBy: 'board',
      };
      renderBoard();
    });

    refreshBtn.addEventListener('click', () => loadBoard(state.selectedBoardId));
    closePaddleBtn.addEventListener('click', closePaddle);
    paddleOverlay.addEventListener('click', (event) => {
      if (event.target === paddleOverlay) closePaddle();
    });
    loadBoard();
  </script>
  <script>
    window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };
  </script>
  <script defer src="/_vercel/insights/script.js"></script>
</body>
</html>
